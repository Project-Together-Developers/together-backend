                    return <span key={b} style={{ fontSize:11, fontWeight:700, padding:'4px 10px', borderRadius:20, background:bc.bg, color:bc.color }}>{b}</span>;
                  })}
                </div>
              )}
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {isMe ? (
                <Btn variant="secondary" onClick={openEdit}>✏️ Редактировать</Btn>
              ) : (
                <>
                  {/* Кнопка дружбы */}
                  {(!friendStatus || friendStatus.status === 'none') && (
                    <Btn onClick={handleFriendAction} disabled={friendLoading}>👥 Добавить в друзья</Btn>
                  )}
                  {friendStatus?.status === 'pending' && friendStatus.isSender && (
                    <Btn variant="secondary" disabled>⏳ Запрос отправлен</Btn>
                  )}
                  {friendStatus?.status === 'pending' && !friendStatus.isSender && (
                    <Btn onClick={handleFriendAction} disabled={friendLoading}>✓ Принять запрос</Btn>
                  )}
                  {friendStatus?.status === 'accepted' && (
                    <>
                      <Btn onClick={()=>onOpenDM(user)}>💬 Написать</Btn>
                      <Btn variant="ghost" size="sm" onClick={handleFriendAction} disabled={friendLoading}>Удалить из друзей</Btn>
                    </>
                  )}
                  <Btn variant="secondary" size="sm" onClick={()=>setShowReviewForm(true)}>Отзыв</Btn>
                </>
              )}
            </div>
          </div>
        </Card>

        {/* Edit form */}
        {editing && (
          <Card style={{ padding:24, marginBottom:16, borderColor:T.accent, animation:'sheet-in 0.3s ease' }}>
            <div style={{ fontSize:16, fontWeight:700, color:T.text, marginBottom:18 }}>Редактировать профиль</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:14 }}>
              <div>
                <SectionLabel>Имя</SectionLabel>
                <input value={editForm.name} onChange={e=>setEditForm(f=>({...f,name:e.target.value}))}
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
              </div>
              <div>
                <SectionLabel>Город</SectionLabel>
                <input value={editForm.location} onChange={e=>setEditForm(f=>({...f,location:e.target.value}))}
                  placeholder="Москва"
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
              </div>
            </div>
            <div style={{ marginBottom:18 }}>
              <SectionLabel>О себе</SectionLabel>
              <Textarea value={editForm.bio} onChange={t=>setEditForm(f=>({...f,bio:t}))} placeholder="Расскажи о себе — опыт, любимые маршруты, снаряжение…" rows={3}/>
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <Btn variant="secondary" onClick={()=>setEditing(false)}>Отмена</Btn>
              <Btn onClick={saveProfile} disabled={saving}>{saving?'Сохранение…':'Сохранить'}</Btn>
            </div>
          </Card>
        )}

        {/* Верификация личности (только для себя) */}
        {isMe && (
          <Card id="verif-section" style={{ padding:20, marginBottom:16, borderColor: user.isVerified ? '#5B8FD4' : verifStatus?.status==='pending' ? T.gold : T.border }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: showVerifForm ? 18 : 0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <div style={{ fontSize:22 }}>🛡️</div>
                <div>
                  <div style={{ fontSize:14, fontWeight:700, color:T.text }}>Верификация личности</div>
                  <div style={{ fontSize:12, color:T.textMuted, marginTop:1 }}>
                    {user.isVerified ? 'Личность подтверждена — можете участвовать в закрытых событиях'
                      : verifStatus?.status==='pending' ? 'Заявка на проверке у модераторов'
                      : verifStatus?.status==='rejected' ? `Отклонено: ${verifStatus.rejectionReason}`
                      : 'Подтвердите личность для доступа к событиям с требованием безопасности'}
                  </div>
                </div>
              </div>
              {!user.isVerified && verifStatus?.status !== 'pending' && (
                <Btn size="sm" variant="secondary" onClick={()=>setShowVerifForm(v=>!v)}>
                  {showVerifForm ? 'Скрыть' : verifStatus?.status==='rejected' ? 'Подать снова' : 'Подтвердить'}
                </Btn>
              )}
            </div>
            {showVerifForm && (
              <div style={{ animation:'sheet-in 0.3s ease' }}>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
                  <div>
                    <SectionLabel>ФИО (как в паспорте)</SectionLabel>
                    <input value={verifForm.fullName} onChange={e=>setVerifForm(f=>({...f,fullName:e.target.value}))}
                      placeholder="Иванов Иван Иванович"
                      style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
                  </div>
                  <div>
                    <SectionLabel>Дата рождения</SectionLabel>
                    <input type="date" value={verifForm.birthDate} onChange={e=>setVerifForm(f=>({...f,birthDate:e.target.value}))}
                      style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none', colorScheme:'dark' }}/>
                  </div>
                </div>
                <div style={{ marginBottom:12 }}>
                  <SectionLabel>Серия и номер паспорта</SectionLabel>
                  <input value={verifForm.passportNumber} onChange={e=>setVerifForm(f=>({...f,passportNumber:e.target.value}))}
                    placeholder="AA 1234567"
                    style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:16 }}>
                  {[['passportPhoto','📄 Фото паспорта'],['selfiePhoto','🤳 Селфи с паспортом']].map(([key,label]) => (
                    <label key={key} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:8, padding:'16px', borderRadius:12, border:`1.5px dashed ${verifFiles[key]?T.accent:T.border}`, background:verifFiles[key]?T.accentBg:T.bgInput, cursor:'pointer', transition:'all 0.2s' }}>
                      <div style={{ fontSize:24 }}>{verifFiles[key] ? '✅' : '📎'}</div>
                      <div style={{ fontSize:12, fontWeight:600, color:verifFiles[key]?T.accent:T.textSub, textAlign:'center' }}>
                        {verifFiles[key] ? verifFiles[key].name : label}
                      </div>
                      <input type="file" accept="image/*" style={{ display:'none' }} onChange={e=>setVerifFiles(f=>({...f,[key]:e.target.files[0]}))}/>
                    </label>
                  ))}
                </div>
                <div style={{ display:'flex', gap:10 }}>
                  <Btn variant="secondary" onClick={()=>setShowVerifForm(false)}>Отмена</Btn>
                  <Btn onClick={submitVerification} disabled={verifLoading}>{verifLoading?<Spinner/>:'Отправить на проверку'}</Btn>
                </div>
              </div>
            )}
          </Card>
        )}

        {/* Stats cards */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, marginBottom:16 }}>
          {[
            { icon:'🧭', val: stats.totalTrips ?? 0,   label:'Поездок', click: null },
            { icon:'📋', val: stats.postsCreated ?? 0, label:'Создано', click: null },
            { icon:'🤝', val: stats.tripsJoined ?? 0,  label:'Участий', click: null },
            { icon:'👥', val: stats.friendsCount ?? 0,  label:'Друзья', click: ()=>setShowFriendsModal(true) },
          ].map((s,i) => (
            <Card key={s.label} style={{ padding:'18px 20px', textAlign:'center', cursor:s.click?'pointer':'default', transition:'all 0.15s', animation:'count-in 0.5s ease both', animationDelay:(0.1+i*0.1)+'s' }} onClick={s.click||undefined}>
              <div style={{ fontSize:22 }}>{s.icon}</div>
              <div style={{ fontSize:26, fontWeight:800, color:s.click?T.accent:T.text, marginTop:4 }}>{s.val}</div>
              <div style={{ fontSize:11, color:T.textMuted, fontWeight:600, marginTop:2, textTransform:'uppercase', letterSpacing:'0.05em' }}>{s.label}</div>
            </Card>
          ))}
        </div>

        {/* Модалка друзей */}
        {showFriendsModal && (
          <FriendsModal
            targetUserId={userId}
            currentUser={currentUser}
            onClose={()=>setShowFriendsModal(false)}
            onOpenProfile={id=>{ setShowFriendsModal(false); onNavigateProfile&&onNavigateProfile(id); }}
            onOpenDM={friend=>{ setShowFriendsModal(false); onOpenDM&&onOpenDM(friend); }}
          />
        )}

        {/* Rating + Activity */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:16 }}>

          {/* Rating breakdown */}
          <Card style={{ padding:20 }}>
            <div style={{ fontSize:13, fontWeight:700, color:T.text, marginBottom:14 }}>Рейтинг</div>
            <div style={{ display:'flex', gap:20, alignItems:'center', marginBottom:16 }}>
              <div>
                <div style={{ fontSize:40, fontWeight:800, color:T.gold, lineHeight:1 }}>{user.rating ?? 0}</div>
                <div style={{ fontSize:18, color:T.gold, marginTop:2 }}>{'★'.repeat(Math.round(user.rating ?? 0))}{'☆'.repeat(5 - Math.round(user.rating ?? 0))}</div>
                <div style={{ fontSize:11, color:T.textMuted, marginTop:4 }}>{user.reviewCount ?? 0} отзывов</div>
              </div>
              <div style={{ flex:1 }}>
                {[5,4,3,2,1].map(star => {
                  const row = ratingBreakdown.find(r => r.star === star) || { count: 0 };
                  return <RatingBar key={star} star={star} count={row.count} max={maxRatingCount}/>;
                })}
              </div>
            </div>
          </Card>

          {/* Monthly activity chart */}
          <Card style={{ padding:20 }}>
            <div style={{ fontSize:13, fontWeight:700, color:T.text, marginBottom:14 }}>Активность за год</div>
            <ActivityChart data={monthlyActivity}/>
          </Card>
        </div>

        {/* Review form */}
        {showReviewForm && (
          <Card style={{ padding:24, marginBottom:16, borderColor:T.accent, animation:'sheet-in 0.3s ease' }}>
            <div style={{ fontSize:16, fontWeight:700, color:T.text, marginBottom:16 }}>Отзыв о {user.name}</div>
            <div style={{ marginBottom:14 }}>
              <SectionLabel>Оценка</SectionLabel>
              <div style={{ display:'flex', gap:8 }}>
                {[5,4,3,2,1].map(r => (
                  <button key={r} onClick={()=>setReviewForm(f=>({...f,rating:r}))}
                    style={{ width:40,height:40,borderRadius:10,border:`1.5px solid ${reviewForm.rating===r?T.gold:T.border}`,background:reviewForm.rating===r?T.goldBg:T.bgInput,color:reviewForm.rating===r?T.gold:T.textSub,fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:800,cursor:'pointer' }}>
                    {r}★
                  </button>
                ))}
              </div>
            </div>
            <Textarea value={reviewForm.text} onChange={t=>setReviewForm(f=>({...f,text:t}))} placeholder="Расскажи об опыте совместной поездки…" rows={3}/>
            <div style={{ display:'flex', gap:10, marginTop:14 }}>
              <Btn variant="secondary" onClick={()=>setShowReviewForm(false)}>Отмена</Btn>
              <Btn onClick={submitReview}>Отправить</Btn>
            </div>
          </Card>
        )}

        {/* Ghost stats */}
        {(user.totalConfirmedEvents > 0 || user.ghostPercent > 0) && (
          <Card style={{ padding:20, marginBottom:16, borderColor: user.ghostPercent > 50 ? T.danger : user.ghostPercent > 20 ? T.gold : T.border }}>
            <div style={{ display:'flex', alignItems:'center', gap:14 }}>
              <div style={{ fontSize:32 }}>💨</div>
              <div style={{ flex:1 }}>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                  <div style={{ fontSize:14, fontWeight:700, color:T.text }}>Уровень воздухана</div>
                  <span style={{ fontSize:13, fontWeight:800, color: user.ghostPercent > 50 ? T.danger : user.ghostPercent > 20 ? T.gold : T.success }}>
                    {user.ghostPercent}%
                  </span>
                </div>
                <div style={{ fontSize:12, color:T.textMuted }}>
                  Не явился на {user.ghostEvents} из {user.totalConfirmedEvents} подтверждённых событий
                </div>
                <div style={{ marginTop:8, height:6, borderRadius:99, background:'rgba(255,255,255,0.06)', overflow:'hidden' }}>
                  <div style={{ height:'100%', borderRadius:99, width:`${user.ghostPercent}%`, background: user.ghostPercent > 50 ? T.danger : user.ghostPercent > 20 ? T.gold : T.success, transition:'width 0.6s ease' }}/>
                </div>
              </div>
            </div>
          </Card>
        )}

        {/* Goals (School 21 style) */}
        {(() => {
          const s = user.stats || {};
          const goals = [
            { id:'first_trip',    icon:'🧭', title:'Первый поход',          desc:'Прими участие в поездке',           target:1,    value:s.tripsJoined??0,    cat:'trips' },
            { id:'trips5',        icon:'⛺', title:'Активный',               desc:'5 участий',                         target:5,    value:s.tripsJoined??0,    cat:'trips' },
            { id:'trips15',       icon:'🏔', title:'Ветеран гор',             desc:'15 участий',                        target:15,   value:s.tripsJoined??0,    cat:'trips' },
            { id:'trips30',       icon:'🦅', title:'Легенда',                 desc:'30 участий',                        target:30,   value:s.tripsJoined??0,    cat:'trips' },
            { id:'first_event',   icon:'📋', title:'Первый организатор',      desc:'Создай событие',                    target:1,    value:s.postsCreated??0,   cat:'org' },
            { id:'events5',       icon:'🎯', title:'Мастер организации',      desc:'Создай 5 событий',                  target:5,    value:s.postsCreated??0,   cat:'org' },
            { id:'events10',      icon:'🏕', title:'Клубный лидер',           desc:'Создай 10 событий',                 target:10,   value:s.postsCreated??0,   cat:'org' },
            { id:'first_friend',  icon:'🤝', title:'Первый друг',             desc:'Добавь друга',                      target:1,    value:s.friendsCount??0,   cat:'social' },
            { id:'friends10',     icon:'👥', title:'Компания',                desc:'10 друзей',                         target:10,   value:s.friendsCount??0,   cat:'social' },
            { id:'friends25',     icon:'🌐', title:'Коннектор',               desc:'25 друзей',                         target:25,   value:s.friendsCount??0,   cat:'social' },
            { id:'verified',      icon:'🛡️', title:'Верифицирован',           desc:'Подтверди личность',                target:1,    value:user.isVerified?1:0,cat:'trust', binary:true },
            { id:'rating45',      icon:'⭐', title:'Надёжный',                desc:'Рейтинг 4.5+',                      target:4.5,  value:user.rating??0,      cat:'trust', isFloat:true },
            { id:'reviews10',     icon:'💬', title:'Популярный',              desc:'10 отзывов',                        target:10,   value:user.reviewCount??0, cat:'trust' },
            { id:'no_ghost',      icon:'👻', title:'Честный участник',        desc:'Уровень воздухана 0%',              target:1,    value:(user.totalConfirmedEvents>0&&user.ghostPercent===0)?1:0, cat:'trust', binary:true },
          ];
          const achieved = goals.filter(g => g.isFloat ? g.value >= g.target : g.value >= g.target);
          const inProgress = goals.filter(g => g.isFloat ? g.value < g.target : g.value < g.target);
          return (
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:15, fontWeight:800, color:T.text, marginBottom:16 }}>🎯 Цели</div>
              {achieved.length > 0 && (
                <div style={{ marginBottom:14 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:T.success, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8 }}>✅ Достигнуто ({achieved.length})</div>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
                    {achieved.map(g => (
                      <div key={g.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'12px 14px', borderRadius:12, background:T.successBg, border:`1px solid ${T.success}33` }}>
                        <div style={{ fontSize:22, flexShrink:0 }}>{g.icon}</div>
                        <div>
                          <div style={{ fontSize:13, fontWeight:700, color:T.success }}>{g.title}</div>
                          <div style={{ fontSize:11, color:T.textMuted }}>{g.desc}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {inProgress.length > 0 && (
                <div>
                  <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8 }}>⏳ В процессе ({inProgress.length})</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                    {inProgress.map(g => {
                      const pct = g.binary ? 0 : Math.min(100, Math.round((g.value / g.target) * 100));
                      const left = g.isFloat ? (g.target - g.value).toFixed(1) : g.target - Math.floor(g.value);
                      return (
                        <div key={g.id} style={{ padding:'14px 16px', borderRadius:12, background:T.bgInput, border:`1px solid ${T.border}` }}>
                          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
                            <div style={{ fontSize:20, flexShrink:0 }}>{g.icon}</div>
                            <div style={{ flex:1 }}>
                              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                <div style={{ fontSize:13, fontWeight:700, color:T.text }}>{g.title}</div>
                                <div style={{ fontSize:11, fontWeight:700, color:T.textMuted }}>
                                  {g.binary ? 'Не выполнено' : g.isFloat ? `${g.value.toFixed(1)} / ${g.target}` : `${Math.floor(g.value)} / ${g.target}`}
                                </div>
                              </div>
                              <div style={{ fontSize:11, color:T.textMuted }}>{g.desc}{!g.binary && ` · осталось ${left}`}</div>
                            </div>
                          </div>
                          {!g.binary && (
                            <div style={{ height:5, borderRadius:99, background:'rgba(255,255,255,0.06)', overflow:'hidden' }}>
                              <div style={{ height:'100%', borderRadius:99, width:`${pct}%`, background:T.accent, transition:'width 0.6s ease' }}/>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })()}

        {/* Reviews */}
        <SectionLabel>Отзывы ({user.reviewCount??0})</SectionLabel>
        {(!user.reviews||user.reviews.length===0) ? (
          <div style={{ color:T.textMuted, fontSize:14, padding:'20px 0' }}>Отзывов пока нет</div>
        ) : (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
            {user.reviews.map(r => (
              <Card key={r.id} style={{ padding:18, animation:'fade-in 0.3s ease' }}>
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
                  <Av name={r.from.name} size={34} url={r.from.avatarUrl} userId={r.from.id}/>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:T.text }}>{r.from.name}</div>
                    <div style={{ fontSize:11, color:T.textMuted }}>{new Date(r.createdAt).toLocaleDateString('ru')}</div>
                  </div>
                  <div style={{ fontSize:13, color:T.gold, fontWeight:700 }}>{'★'.repeat(r.rating)}</div>
                </div>
                <div style={{ fontSize:13, color:T.textSub, lineHeight:1.6 }}>{r.text}</div>
              </Card>
            ))}
          </div>
        )}

      </div>
    </div>
  );
}

// ── RECOMMENDATIONS PAGE ──────────────────────────────────────────────────────
const REC_CATEGORIES = [
  { id:'all',      label:'Все' },
  { id:'cinema',   label:'🎬 Кино' },
  { id:'theater',  label:'🎭 Театр' },
  { id:'concert',  label:'🎵 Концерты' },
  { id:'bar',      label:'🍻 Бар' },
  { id:'sport',    label:'⛷️ Спорт' },
  { id:'other',    label:'✨ Другое' },
];

const EMPTY_REC = { title:'', description:'', category:'cinema', imageUrl:'', link:'', duration:'', eventLocation:'', language:'', price:'', isFree:false };

function GTicketsCard({ movie }) {
  const genres = (movie.genres || []).slice(0, 2).join(', ');
  const today = new Date().toISOString().split('T')[0];
  const link = `https://gtickets.uz/cinemas/movie/${movie.id}?date=${today}`;
  return (
    <Card style={{ padding:0, overflow:'hidden', display:'flex', flexDirection:'column' }}>
      <div style={{ height:220, overflow:'hidden', background:T.bgInput, position:'relative' }}>
        <img src={movie.poster} alt={movie.title}
          style={{ width:'100%', height:'100%', objectFit:'cover' }}
          onError={e=>e.target.style.display='none'}/>
        {movie.age_rating && (
          <div style={{ position:'absolute', top:10, right:10, background:'rgba(0,0,0,0.7)', color:'#fff', fontSize:11, fontWeight:700, padding:'3px 8px', borderRadius:6 }}>
            {movie.age_rating}
          </div>
        )}
        {(movie.qualifiers||[]).includes('premiere') && (
          <div style={{ position:'absolute', top:10, left:10, background:T.accent, color:'#fff', fontSize:10, fontWeight:800, padding:'3px 8px', borderRadius:6 }}>
            ПРЕМЬЕРА
          </div>
        )}
      </div>
      <div style={{ padding:16, flex:1, display:'flex', flexDirection:'column', gap:8 }}>
        <div style={{ fontSize:15, fontWeight:700, color:T.text, lineHeight:1.3 }}>{movie.title}</div>
        {genres && <div style={{ fontSize:12, color:T.textMuted }}>{genres}</div>}
        <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
          {(movie.formats||[]).map(f => (
            <span key={f} style={{ fontSize:11, fontWeight:700, padding:'3px 9px', borderRadius:20, background:T.bgInput, color:T.textSub }}>{f}</span>
          ))}
        </div>
        <div style={{ marginTop:'auto', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ fontSize:12, color:T.textMuted }}>
            🎬 {movie.cinema_seances?.cinema_count ?? 0} кинотеатров
          </div>
          <a href={link} target="_blank" rel="noreferrer"
            style={{ fontSize:12, color:T.accent, fontWeight:700, textDecoration:'none', padding:'6px 14px', borderRadius:10, background:T.accentBg }}>
            Купить билет →
          </a>
        </div>
      </div>
    </Card>
  );
}

            {e.age_rating}
          </div>
        )}
      </div>
      <div style={{ padding:16, flex:1, display:'flex', flexDirection:'column', gap:6 }}>

          <div style={{ fontSize:12, color:T.textSub }}>{e.genres.slice(0,2).join(', ')}</div>

        <div style={{ marginTop:'auto', paddingTop:8, display:'flex', alignItems:'center', justifyContent:'space-between', gap:8 }}>
          <div>
            {date && <div style={{ fontSize:11, color:T.textMuted }}>📅 {date}</div>}

          </div>
          <a href={link} target="_blank" rel="noreferrer"

            Билеты →
          </a>
        </div>
      </div>
    </Card>
  );
}

    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:1000, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', padding:20, animation:'fade-in 0.2s ease' }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:T.bgCard, border:`1.5px solid ${T.border}`, borderRadius:24, width:'100%', maxWidth:560, maxHeight:'90vh', overflow:'hidden', display:'flex', flexDirection:'column', animation:'sheet-in 0.3s ease' }}>

              <div style={{ fontSize:12, color:T.textMuted }}>от {rec.createdBy.name}</div>

            <button onClick={onClose} style={{ width:34, height:34, borderRadius:10, border:`1px solid ${T.border}`, background:T.bgInput, color:T.textSub, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>

          {/* Цена */}
          {rec.isFree
            ? <div style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'8px 16px', borderRadius:10, background:'oklch(0.2 0.06 155)', color:'oklch(0.65 0.18 155)', fontWeight:800, fontSize:15, marginBottom:16 }}>✓ Бесплатно</div>

          <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:20 }}>

            {rec.eventLocation && <span style={{ display:'flex', alignItems:'center', gap:5, fontSize:13, color:T.textSub, background:T.bgInput, padding:'6px 12px', borderRadius:99 }}>📍 {rec.eventLocation}</span>}
            {rec.language && <span style={{ display:'flex', alignItems:'center', gap:5, fontSize:13, color:T.textSub, background:T.bgInput, padding:'6px 12px', borderRadius:99 }}>🌐 {rec.language}</span>}
          </div>

          {/* Описание */}
          {rec.description && (
            <div style={{ fontSize:14, color:T.textSub, lineHeight:1.75, marginBottom:20 }}>{rec.description}</div>
          )}

          {/* Кнопки */}
          <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
            {rec.link && (
              <a href={rec.link} target="_blank" rel="noreferrer" style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'11px 22px', borderRadius:12, background:T.accent, color:'#fff', fontWeight:700, fontSize:14, textDecoration:'none', boxShadow:`0 4px 16px ${T.accent}44` }}>
                Открыть →
              </a>
            )}
            {canEditRec && <Btn variant="secondary" size="sm" onClick={()=>{ onClose(); onEdit(rec); }}>✏️ Редактировать</Btn>}
            {canDelete && <Btn variant="danger" size="sm" onClick={()=>{ onClose(); onRemove(rec); }}>🗑️ Удалить</Btn>}

function RecsPage({ currentUser }) {
  const canEdit = currentUser.role === 'editor' || currentUser.role === 'admin';
  const isAdmin = currentUser.role === 'admin';

  const [recs, setRecs] = React.useState([]);
  const [movies, setMovies] = React.useState([]);
  const [theaterEvents, setTheaterEvents] = React.useState([]);
  const [visibleMovies, setVisibleMovies] = React.useState(12);
  const [visibleTheater, setVisibleTheater] = React.useState(12);
  const [loading, setLoading] = React.useState(true);
  const [cat, setCat] = React.useState('all');
  const [showForm, setShowForm] = React.useState(false);
  const [form, setForm] = React.useState(EMPTY_REC);
  const [editingId, setEditingId] = React.useState(null);
  const [saving, setSaving] = React.useState(false);
  const [uploading, setUploading] = React.useState(false);
  const [detailRec, setDetailRec] = React.useState(null);

  const load = async (c) => {
    setLoading(true);
    setVisibleMovies(12);
    setVisibleTheater(12);
    const needMovies  = c === 'all' || c === 'cinema';
    const needTheater = c === 'all' || c === 'theater' || c === 'concert';
    // для рекомендаций из БД: theater/concert не являются нашими категориями → показываем все
    const dbCat = (c === 'theater' || c === 'concert') ? null : c === 'all' ? null : c;
    try {
      const [recsData, moviesData, theaterData] = await Promise.allSettled([
        api.getRecommendations(dbCat),
        needMovies  ? api.getGTicketsEvents()  : Promise.resolve(null),
        needTheater ? api.getGTicketsTheater() : Promise.resolve(null),
      ]);
      if (recsData.status === 'fulfilled') setRecs(recsData.value);
      if (moviesData.status === 'fulfilled' && moviesData.value) setMovies(moviesData.value.releases || []);
      else setMovies([]);
      if (theaterData.status === 'fulfilled' && theaterData.value) {
        const all = theaterData.value || [];
        if (c === 'theater')  setTheaterEvents(all.filter(e => e.event_type === 'Театр'));
        else if (c === 'concert') setTheaterEvents(all.filter(e => e.event_type === 'Концерт'));
        else setTheaterEvents(all);
      } else setTheaterEvents([]);
    } catch(e) { toast(e.message,'error'); }
    finally { setLoading(false); }
  };

  React.useEffect(() => { load(cat); }, [cat]);

  const openCreate = () => { setForm(EMPTY_REC); setEditingId(null); setShowForm(true); };
  const openEdit = (r) => {
    setForm({ title:r.title, description:r.description, category:r.category, imageUrl:r.imageUrl||'', link:r.link||'', duration:r.duration||'', eventLocation:r.eventLocation||'', language:r.language||'', price:r.price??'', isFree:r.isFree||false });
    setEditingId(r.id);
    setShowForm(true);
  };

  const handleImageUpload = async (file) => {
    if (!file) return;
    setUploading(true);
    try {
      const url = await api.uploadImage(file);
      setForm(f => ({ ...f, imageUrl: url }));
      toast('Картинка загружена ✓');
    } catch(e) { toast(e.message, 'error'); }
    finally { setUploading(false); }
  };

  const save = async () => {
    if (!form.title.trim()) return toast('Введи название','error');
    setSaving(true);
    try {
      const payload = { ...form, price: form.price !== '' ? parseFloat(form.price) : null };
      if (editingId) await api.updateRecommendation(editingId, payload);
      else await api.createRecommendation(payload);
      setShowForm(false);
      load(cat);
      toast(editingId ? 'Обновлено' : 'Добавлено 🎉');
    } catch(e) { toast(e.message,'error'); }
    finally { setSaving(false); }
  };

  const remove = async (r) => {
    if (!confirm(`Удалить «${r.title}»?`)) return;
    try { await api.deleteRecommendation(r.id); load(cat); toast('Удалено'); }
    catch(e) { toast(e.message,'error'); }
  };

  const canDelete = (r) => isAdmin || (canEdit && r.createdBy.id === currentUser.id);
  const canEditRec = (r) => isAdmin || (canEdit && r.createdBy.id === currentUser.id);

  const catLabel = id => REC_CATEGORIES.find(c=>c.id===id)?.label || id;

  return (
    <div style={{ flex:1, overflowY:'auto', padding:32 }}>
      <div style={{ maxWidth:960, margin:'0 auto' }}>

        {/* Header */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:24 }}>
          <div style={{ fontSize:26, fontWeight:800, color:T.text, letterSpacing:'-0.02em' }}>Куда сходить</div>
          {canEdit && <Btn onClick={openCreate}>+ Добавить</Btn>}
        </div>

        {/* Category filter */}
        <div style={{ display:'flex', gap:8, marginBottom:24, flexWrap:'wrap' }}>
          {REC_CATEGORIES.map(c => (
            <button key={c.id} onClick={()=>setCat(c.id)}
              style={{ padding:'8px 16px', borderRadius:20, border:`1.5px solid ${cat===c.id?T.accent:T.border}`, background:cat===c.id?T.accentBg:'transparent', color:cat===c.id?T.accent:T.textSub, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:13, fontWeight:600, cursor:'pointer' }}>
              {c.label}
            </button>
          ))}
        </div>

        {/* Form */}
        {showForm && (
          <Card style={{ padding:24, marginBottom:24, borderColor:T.accent, animation:'sheet-in 0.3s ease' }}>
            <div style={{ fontSize:16, fontWeight:700, color:T.text, marginBottom:18 }}>{editingId ? 'Редактировать' : 'Новая рекомендация'}</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:14 }}>
              <div>
                <SectionLabel>Название</SectionLabel>
                <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Название"
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
              </div>
              <div>
                <SectionLabel>Категория</SectionLabel>
                <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none', cursor:'pointer' }}>
                  {REC_CATEGORIES.filter(c=>c.id!=='all').map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
              </div>
            </div>
            <div style={{ marginBottom:14 }}>
              <SectionLabel>Описание</SectionLabel>
              <Textarea value={form.description} onChange={t=>setForm(f=>({...f,description:t}))} placeholder="Расскажи подробнее…" rows={3}/>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:14 }}>
              <div>
                <SectionLabel>Длительность</SectionLabel>
                <input value={form.duration} onChange={e=>setForm(f=>({...f,duration:e.target.value}))} placeholder="1ч 45мин"
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
              </div>
              <div>
                <SectionLabel>Место проведения</SectionLabel>
                <input value={form.eventLocation} onChange={e=>setForm(f=>({...f,eventLocation:e.target.value}))} placeholder="Малый театр, зал №2"
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
              </div>
              <div>
                <SectionLabel>Язык</SectionLabel>
                <input value={form.language} onChange={e=>setForm(f=>({...f,language:e.target.value}))} placeholder="Русский, O'zbek"
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
              </div>
              <div>
                <SectionLabel>Ссылка</SectionLabel>
                <input value={form.link} onChange={e=>setForm(f=>({...f,link:e.target.value}))} placeholder="https://..."
                  style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
              </div>
            </div>
            {/* Цена */}
            <div style={{ display:'flex', gap:12, alignItems:'center', marginBottom:14 }}>
              <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', fontSize:14, color:T.text, fontWeight:600 }}>
                <input type="checkbox" checked={form.isFree} onChange={e=>setForm(f=>({...f,isFree:e.target.checked,price:''}))} style={{ width:16, height:16, accentColor:T.accent }}/>
                Бесплатно
              </label>
              {!form.isFree && (
                <div style={{ flex:1 }}>
                  <input value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))} placeholder="Цена в сумах (необязательно)"
                    type="number" min="0"
                    style={{ width:'100%', boxSizing:'border-box', padding:'10px 14px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:14, outline:'none' }}/>
                </div>
              )}
            </div>
            {/* Картинка */}
            <div style={{ marginBottom:18 }}>
              <SectionLabel>Картинка (макс. 10 МБ)</SectionLabel>
              <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                <label style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'10px 18px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.bgInput, color:T.textSub, cursor:'pointer', fontSize:13, fontWeight:600 }}>
                  {uploading ? <Spinner/> : '📎 Выбрать файл'}
                  <input type="file" accept="image/*" style={{ display:'none' }} onChange={e=>handleImageUpload(e.target.files[0])} disabled={uploading}/>

                {form.imageUrl && (
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <img src={form.imageUrl} alt="" style={{ height:40, width:60, objectFit:'cover', borderRadius:8, border:`1px solid ${T.border}` }} onError={e=>e.target.style.display='none'}/>
                    <button onClick={()=>setForm(f=>({...f,imageUrl:''}))} style={{ background:'none', border:'none', color:T.danger, cursor:'pointer', fontSize:18 }}>×</button>

              <Btn variant="secondary" onClick={()=>setShowForm(false)}>Отмена</Btn>

                      <div style={{ position:'absolute', top:10, left:10, background:'oklch(0.2 0.06 155)', color:'oklch(0.65 0.18 155)', fontSize:11, fontWeight:800, padding:'4px 10px', borderRadius:20, border:'1px solid oklch(0.65 0.18 155)' }}>

                    <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8 }}>

        {/* GTickets театр и концерты — ПОСЛЕ наших */}
        {(cat === 'all' || cat === 'theater' || cat === 'concert') && theaterEvents.length > 0 && (
          <div style={{ marginBottom:32 }}>
            <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16 }}>
              <div style={{ fontSize:16, fontWeight:800, color:T.text }}>
                {cat === 'concert' ? '🎵 Концерты' : cat === 'theater' ? '🎭 Театр' : '🎭 Театры и концерты'}
              </div>
              <a href="https://gtickets.uz" target="_blank" rel="noreferrer"
                style={{ fontSize:12, color:T.accent, fontWeight:600, textDecoration:'none' }}>gtickets.uz →</a>
              <span style={{ fontSize:12, color:T.textMuted }}>{theaterEvents.length} событий</span>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))', gap:14 }}>
              {theaterEvents.slice(0, visibleTheater).map(e => <GTicketsTheaterCard key={e.id} event={e}/>)}
            </div>
            {visibleTheater < theaterEvents.length && (
              <div style={{ textAlign:'center', marginTop:20 }}>
                <Btn variant="secondary" onClick={()=>setVisibleTheater(v=>v+12)}>
                  Показать ещё ({theaterEvents.length - visibleTheater} осталось)
                </Btn>
              </div>
            )}
          </div>
        )}

        {/* Пусто */}
        {!loading && recs.length === 0 && movies.length === 0 && theaterEvents.length === 0 && (
          <div style={{ color:T.textMuted, fontSize:14, textAlign:'center', padding:'60px 0' }}>
            {canEdit ? 'Рекомендаций пока нет. Добавь первую!' : 'Рекомендаций пока нет'}
          </div>
        )}

        {/* Детальное модальное окно */}
        {detailRec && (
          <RecDetailModal
            rec={detailRec}
            onClose={()=>setDetailRec(null)}
            canEditRec={canEditRec(detailRec)}
            canDelete={canDelete(detailRec)}
            onEdit={openEdit}
            onRemove={remove}
          />
        )}
      </div>
    </div>
  );
}

// ── ATTENDANCE MODAL ───────────────────────────────────────────────────────────
function AttendanceModal({ post, currentUser, onClose, onDone }) {
  const participants = post.participants.filter(p => p.status === 'approved' && p.userId !== currentUser.id);
  const [present, setPresent] = React.useState(() => {
    const m = {};
    participants.forEach(p => { m[p.userId] = true; });
    return m;
  });
  const [loading, setLoading] = React.useState(false);

  const toggle = id => setPresent(p => ({ ...p, [id]: !p[id] }));

  const submit = async () => {
    setLoading(true);
    try {
      const presentIds = Object.entries(present).filter(([,v])=>v).map(([k])=>parseInt(k));
      await api.submitAttendance(post.id, presentIds);
      toast('Посещаемость отмечена ✓');
      onDone();
    } catch(e) { toast(e.message, 'error'); }
    setLoading(false);
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.75)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}>
      <Card style={{ padding:28, width:460, maxHeight:'80vh', display:'flex', flexDirection:'column', animation:'bounce-in 0.35s ease' }}>
        <div style={{ fontSize:18, fontWeight:800, color:T.text, marginBottom:4 }}>✅ Отметить участников</div>
        <div style={{ fontSize:13, color:T.textMuted, marginBottom:20 }}>Отметьте кто реально был на событии «{post.location}»</div>
        <div style={{ flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:8, marginBottom:20 }}>
          {participants.length === 0
            ? <div style={{ color:T.textMuted, fontSize:14 }}>Нет других участников</div>
            : participants.map(pt => (
              <button key={pt.userId} onClick={()=>toggle(pt.userId)}
                style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 14px', borderRadius:12, border:`1.5px solid ${present[pt.userId]?T.accent:T.border}`, background:present[pt.userId]?T.accentBg:T.bgInput, cursor:'pointer', fontFamily:"'Plus Jakarta Sans',sans-serif", transition:'all 0.15s', textAlign:'left' }}>
                <div style={{ width:22, height:22, borderRadius:6, border:`2px solid ${present[pt.userId]?T.accent:T.textMuted}`, background:present[pt.userId]?T.accent:'transparent', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'all 0.15s' }}>
                  {present[pt.userId] && <svg viewBox="0 0 12 12" width="10" height="10" fill="none"><polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </div>
                <Av name={pt.user.name} size={34} url={pt.user.avatarUrl} userId={pt.userId}/>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:T.text }}>{pt.user.name}</div>
                  <div style={{ fontSize:11, color:T.textMuted }}>@{pt.user.username}</div>
                </div>
                <div style={{ fontSize:12, fontWeight:700, color:present[pt.userId]?T.success:T.danger }}>
                  {present[pt.userId] ? '✓ Был' : '✗ Не был'}
                </div>
              </button>
            ))
          }
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <Btn variant="secondary" onClick={onClose}>Отмена</Btn>
          <Btn onClick={submit} disabled={loading} full>{loading?<Spinner/>:'Подтвердить'}</Btn>
        </div>
      </Card>
    </div>
  );
}

// ── MODERATION PANEL ──────────────────────────────────────────────────────────
function ModerationPanel() {
  const [requests, setRequests] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [filter, setFilter] = React.useState('pending');
  const [rejectModal, setRejectModal] = React.useState(null); // {id}
  const [rejectReason, setRejectReason] = React.useState('');
  const [actionLoading, setActionLoading] = React.useState(false);

  const load = async () => {
    setLoading(true);
    try { setRequests(await api.getVerificationRequests()); } catch(e) { toast(e.message,'error'); }
    setLoading(false);
  };
  React.useEffect(() => { load(); }, []);

  const approve = async (id) => {
    setActionLoading(true);
    try {
      await api.approveVerification(id);
      toast('Верификация одобрена ✓');
      load();
    } catch(e) { toast(e.message,'error'); }
    setActionLoading(false);
  };

  const openReject = (id) => { setRejectModal({ id }); setRejectReason(''); };

  const confirmReject = async () => {
    if (!rejectReason.trim()) return toast('Укажите причину', 'error');
    setActionLoading(true);
    try {
      await api.rejectVerification(rejectModal.id, rejectReason.trim());
      toast('Заявка отклонена');
      setRejectModal(null);
      load();
    } catch(e) { toast(e.message,'error'); }
    setActionLoading(false);
  };

  const filtered = requests.filter(r => filter === 'all' || r.status === filter);

  return (
    <div style={{ flex:1, overflowY:'auto', padding:32 }}>
      <div style={{ maxWidth:900, margin:'0 auto' }}>
        <div style={{ fontSize:26, fontWeight:800, color:T.text, marginBottom:6 }}>Панель модерации</div>
        <div style={{ fontSize:14, color:T.textMuted, marginBottom:24 }}>Проверка заявок на верификацию личности</div>

        {/* Фильтры */}
        <div style={{ display:'flex', gap:8, marginBottom:20 }}>
          {[['pending','⏳ Ожидают'],['approved','✅ Одобрены'],['rejected','❌ Отклонены'],['all','Все']].map(([s,l]) => (
            <button key={s} onClick={()=>setFilter(s)}
              style={{ padding:'8px 16px', borderRadius:20, border:`1.5px solid ${filter===s?T.accent:T.border}`, background:filter===s?T.accentBg:T.bgInput, color:filter===s?T.accent:T.textSub, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:13, fontWeight:600, cursor:'pointer', transition:'all 0.15s' }}>
              {l} {s !== 'all' && <span style={{ marginLeft:4, fontSize:11 }}>({requests.filter(r=>r.status===s).length})</span>}
            </button>
          ))}
        </div>

        {loading ? <div style={{ display:'flex', justifyContent:'center', padding:60 }}><Spinner/></div> : (
          filtered.length === 0
            ? <div style={{ color:T.textMuted, fontSize:14, padding:'40px 0', textAlign:'center' }}>Заявок нет</div>
            : <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
                {filtered.map(req => (
                  <Card key={req.id} style={{ padding:20, animation:'fade-in 0.3s ease' }}>
                    <div style={{ display:'flex', alignItems:'flex-start', gap:16, marginBottom:16 }}>
                      <Av name={req.user.name} size={44} url={req.user.avatarUrl} userId={req.user.id}/>
                      <div style={{ flex:1 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                          <div style={{ fontSize:15, fontWeight:700, color:T.text }}>{req.user.name}</div>
                          <Tag color={req.status==='approved'?T.success:req.status==='rejected'?T.danger:T.gold}
                               bg={req.status==='approved'?T.successBg:req.status==='rejected'?T.dangerBg:T.goldBg}>
                            {req.status==='approved'?'Одобрен':req.status==='rejected'?'Отклонён':'Ожидает'}
                          </Tag>
                        </div>
                        <div style={{ fontSize:12, color:T.textMuted }}>@{req.user.username} · Подано {new Date(req.createdAt).toLocaleDateString('ru')}</div>
                      </div>
                      {req.status === 'pending' && (
                        <div style={{ display:'flex', gap:8 }}>
                          <Btn onClick={()=>approve(req.id)} disabled={actionLoading}>✓ Одобрить</Btn>
                          <Btn variant="danger" onClick={()=>openReject(req.id)} disabled={actionLoading}>✕ Отклонить</Btn>
                        </div>
                      )}
                    </div>

                    {/* Паспортные данные */}
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, marginBottom:14, padding:'12px 14px', background:T.bgInput, borderRadius:10 }}>
                      <div>
                        <div style={{ fontSize:10, color:T.textMuted, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:3 }}>ФИО</div>
                        <div style={{ fontSize:13, color:T.text, fontWeight:600 }}>{req.fullName}</div>
                      </div>
                      <div>
                        <div style={{ fontSize:10, color:T.textMuted, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:3 }}>Паспорт</div>
                        <div style={{ fontSize:13, color:T.text, fontWeight:600 }}>{req.passportNumber}</div>
                      </div>
                      <div>
                        <div style={{ fontSize:10, color:T.textMuted, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:3 }}>Дата рождения</div>
                        <div style={{ fontSize:13, color:T.text, fontWeight:600 }}>{req.birthDate}</div>
                      </div>
                    </div>

                    {/* Фото */}
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                      {[['passportPhotoUrl','📄 Фото паспорта'],['selfiePhotoUrl','🤳 Селфи с паспортом']].map(([key,label]) => (
                        <div key={key}>
                          <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, marginBottom:6 }}>{label}</div>

                        </div>
                      ))}
                    </div>

                    {req.status === 'rejected' && req.rejectionReason && (
                      <div style={{ marginTop:12, padding:'10px 14px', background:T.dangerBg, borderRadius:8, fontSize:13, color:T.danger }}>
                        <strong>Причина отклонения:</strong> {req.rejectionReason}

                ))}
              </div>
        )}
      </div>

      {/* Модалка отклонения */}
      {rejectModal && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}>
          <Card style={{ padding:28, width:440, animation:'bounce-in 0.35s ease' }}>
            <div style={{ fontSize:16, fontWeight:700, color:T.text, marginBottom:14 }}>Причина отклонения</div>
            <Textarea value={rejectReason} onChange={setRejectReason} placeholder="Опишите причину: нечёткое фото, данные не совпадают, поддельный документ…" rows={4}/>
            <div style={{ display:'flex', gap:10, marginTop:16 }}>
              <Btn variant="secondary" onClick={()=>setRejectModal(null)}>Отмена</Btn>
              <Btn variant="danger" onClick={confirmReject} disabled={actionLoading}>{actionLoading?<Spinner/>:'Отклонить'}</Btn>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = React.useState(() => { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } });
  const [page, setPage] = React.useState('feed');
  const [profileId, setProfileId] = React.useState(null);
  const [openPostId, setOpenPostId] = React.useState(null);
  const [autoOpenVerify, setAutoOpenVerify] = React.useState(false);
  const [theme, setTheme] = React.useState(() => localStorage.getItem('theme')||'dark');
  const [connection, setConnection] = React.useState(null);
  const [, forceUpdate] = React.useReducer(x=>x+1, 0);
  const [chatSubTab, setChatSubTab] = React.useState('groups');
  const [dmFriend, setDmFriend] = React.useState(null);
  const [currentDmFriendId, setCurrentDmFriendId] = React.useState(null);
  const [notifications, setNotifications] = React.useState([]);
  const [unreadDmSenders, setUnreadDmSenders] = React.useState(new Set());
  const [showNotifPanel, setShowNotifPanel] = React.useState(false);
  const [myAvatarUrl, setMyAvatarUrl] = React.useState(null);
  const [showLanding, setShowLanding] = React.useState(() => !localStorage.getItem('user'));

  const pageRef = React.useRef(page);
  const chatSubTabRef = React.useRef(chatSubTab);
  const currentDmFriendIdRef = React.useRef(currentDmFriendId);
  React.useEffect(() => { pageRef.current = page; }, [page]);
  React.useEffect(() => { chatSubTabRef.current = chatSubTab; }, [chatSubTab]);
  React.useEffect(() => { currentDmFriendIdRef.current = currentDmFriendId; }, [currentDmFriendId]);

  React.useEffect(() => {
    const conn = new signalR.HubConnectionBuilder()
      .withUrl(BASE + '/hub')
      .withAutomaticReconnect()
      .build();
    conn.start().then(() => {
      conn.invoke('JoinFeed');
      if (user) conn.invoke('JoinUser', user.id);
      setConnection(conn);
    }).catch(() => {});
    return () => conn.stop();
  }, []);

  // Загружаем уведомления при старте и подписываемся на реал-тайм события
  React.useEffect(() => {
    if (!user) return;
    api.getNotifications().then(setNotifications).catch(() => {});

    // Загружаем профиль: синхронизируем role/isVerified/avatarUrl из БД в localStorage
    api.getUser(user.id).then(u => {
      setMyAvatarUrl(u.avatarUrl);
      const fresh = { ...user, role: u.role, isVerified: u.isVerified, avatarUrl: u.avatarUrl };
      localStorage.setItem('user', JSON.stringify(fresh));
      // Если role или isVerified изменились — обновляем состояние
      if (u.role !== user.role || u.isVerified !== user.isVerified) {
        setUser(fresh);
      }
    }).catch(() => {});
  }, [user?.id]);

  React.useEffect(() => {
    if (!connection) return;

    const onNewNotif = notif => {
      setNotifications(n => [notif, ...n]);
    };

    const onNewDM = msg => {
      const senderId = msg.sender?.id;
      if (!senderId) return;
      if (pageRef.current === 'chats' && chatSubTabRef.current === 'friends' && currentDmFriendIdRef.current === senderId) return;
      setUnreadDmSenders(s => new Set([...s, senderId]));
    };

    const onAvatarUpdated = ({ userId, avatarUrl }) => {
      setAvatarCache(userId, avatarUrl);
      if (userId === user?.id) setMyAvatarUrl(avatarUrl);
    };

    connection.on('NewNotification', onNewNotif);
    connection.on('NewDM', onNewDM);
    connection.on('AvatarUpdated', onAvatarUpdated);
    return () => {
      connection.off('NewNotification', onNewNotif);
      connection.off('NewDM', onNewDM);
      connection.off('AvatarUpdated', onAvatarUpdated);
    };
  }, [connection, user?.id]);

  const toggleTheme = () => {
    const next = theme==='dark'?'light':'dark';
    localStorage.setItem('theme', next);
    T = THEMES[next];
    setTheme(next);
    document.body.style.background = T.bg;
    document.body.style.color = T.text;
    forceUpdate();
  };

  React.useEffect(() => {
    document.body.style.background = T.bg;
    document.body.style.color = T.text;
  }, []);

  const logout = () => {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    setNotifications([]);
    setUnreadDmSenders(new Set());
    setMyAvatarUrl(null);
    setShowNotifPanel(false);
    setShowLanding(true);
    setUser(null);
    setTimeout(() => toast('Вышел из аккаунта'), 50);
  };

  const nav = (p, opts={}) => {
    setPage(p);
    if (opts.profileId !== undefined) setProfileId(opts.profileId);
    else if (p === 'profile') setProfileId(user?.id ?? null);
    if (p !== 'feed') setOpenPostId(null);
    if (p !== 'chats') { setChatSubTab('groups'); setDmFriend(null); setCurrentDmFriendId(null); }
  };

  const openDM = (friend) => {
    setDmFriend(friend);
    setChatSubTab('friends');
    setPage('chats');
    setUnreadDmSenders(s => { const next = new Set(s); next.delete(friend.id); return next; });
  };

  const onFriendOpen = (friendId) => {
    setCurrentDmFriendId(friendId);
    setUnreadDmSenders(s => { const next = new Set(s); next.delete(friendId); return next; });
  };

  const markAllRead = async () => {
    try {
      await api.markAllRead();
      setNotifications(n => n.map(x => ({ ...x, isRead: true })));
    } catch {}
  };

  const unreadNotifCount = notifications.filter(n => !n.isRead).length;
  const unreadDmCount = unreadDmSenders.size;

  if (!user) {
    if (showLanding) return <>
      <LandingPage onGetStarted={() => setShowLanding(false)}/>
      <ToastContainer/>
    </>;
    return <>
      <AuthPage onAuth={u => {
        setUser(u);
        setPage('feed');
        setProfileId(null);
        setOpenPostId(null);
        if (connection) connection.invoke('JoinUser', u.id).catch(()=>{});
        setTimeout(() => toast(`Добро пожаловать, ${u.name}! 👋`), 50);
      }}/>
      <ToastContainer/>
    </>;
  }

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden', fontFamily:"'Plus Jakarta Sans',sans-serif", background:T.bg, color:T.text }}>
      <Sidebar
        page={page}
        onNav={p => { nav(p); setShowNotifPanel(false); }}
        user={user}
        onLogout={logout}
        theme={theme}
        onToggleTheme={toggleTheme}
        unreadDmCount={unreadDmCount}
        unreadNotifCount={unreadNotifCount}
        onOpenNotifications={()=>setShowNotifPanel(v=>!v)}
        avatarUrl={myAvatarUrl}
      />

      {showNotifPanel && (
        <NotificationPanel
          notifications={notifications}
          currentUser={user}
          onClose={()=>setShowNotifPanel(false)}
          onMarkAllRead={markAllRead}
        />
      )}

      <div style={{ flex:1, display:'flex', minWidth:0, background:T.bg }}>
        {page==='feed' && (
          <>
            <FeedPage currentUser={user} connection={connection} onOpenPost={id => setOpenPostId(id)}/>
            {openPostId && (
              <EventDetailPanel
                postId={openPostId}
                currentUser={user}
                connection={connection}
                onClose={()=>setOpenPostId(null)}
                onNavigateProfile={id=>nav('profile',{profileId:id})}
                onGoVerify={()=>{ setOpenPostId(null); setAutoOpenVerify(true); nav('profile',{profileId:user.id}); }}
              />
            )}
          </>
        )}
        {page==='create' && (
          <div className="page-anim" style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
            <CreatePage onDone={id=>{
              toast('Событие опубликовано! 🎉');
              setOpenPostId(id);
              setPage('feed');
            }}/>
          </div>
        )}
        {page==='recs' && <div className="page-anim" style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}><RecsPage currentUser={user}/></div>}
        {page==='chats' && (
          <div className="page-anim" style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
            {/* Sub-tabs */}
            <div style={{ display:'flex', gap:8, padding:'16px 20px 0', borderBottom:`1px solid ${T.border}`, flexShrink:0, background:T.bg }}>
              {[['groups','👥 Группы'],['friends','💬 Личные']].map(([tab,label]) => (
                <button key={tab} onClick={()=>{ setChatSubTab(tab); if(tab==='groups'){ setDmFriend(null); setCurrentDmFriendId(null); } }}
                  style={{ padding:'8px 18px', borderRadius:'10px 10px 0 0', border:`1.5px solid ${chatSubTab===tab?T.accent:T.border}`, borderBottom:'none', background:chatSubTab===tab?T.accentBg:T.bg, color:chatSubTab===tab?T.accent:T.textSub, fontFamily:"'Plus Jakarta Sans',sans-serif", fontWeight:700, fontSize:14, cursor:'pointer', transition:'all 0.15s', display:'flex', alignItems:'center', gap:6 }}>
                  {label}
                  {tab==='friends' && unreadDmCount>0 && <Badge count={unreadDmCount}/>}
                </button>
              ))}
            </div>
            <div style={{ flex:1, display:'flex', minHeight:0 }}>
              {chatSubTab==='groups'
                ? <ChatsPage currentUser={user} connection={connection} onNavigateProfile={id=>nav('profile',{profileId:id})}/>
                : <DMPage currentUser={user} connection={connection} initialFriend={dmFriend} onNavigateProfile={id=>nav('profile',{profileId:id})} onFriendOpen={onFriendOpen}/>
              }
            </div>
          </div>
        )}
        {page==='profile' && (
          <div className="page-anim" style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
            <ProfilePage
              userId={profileId||user.id}
              currentUser={user}
              onOpenDM={openDM}
              onNavigateProfile={id=>nav('profile',{profileId:id})}
              autoOpenVerify={autoOpenVerify}
              onVerifyOpened={()=>setAutoOpenVerify(false)}
              onUserUpdate={u=>setUser(u)}
            />
          </div>
        )}
        {page==='leaderboard' && (
          <div className="page-anim" style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
            <LeaderboardPage onNavigateProfile={id=>nav('profile',{profileId:id})}/>
          </div>
        )}
        {page==='moderation' && (
          <div className="page-anim" style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
            <ModerationPanel/>
          </div>
        )}
      </div>

      <ToastContainer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
