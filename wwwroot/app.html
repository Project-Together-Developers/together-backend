// ── API ───────────────────────────────────────────────────────────────────────
const BASE = '';
async function req(method, path, body) {
  const token = localStorage.getItem('token');
  const res = await fetch(BASE + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    body: body != null ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const text = await res.text().catch(() => '');
  let data; try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) throw new Error(typeof data === 'string' ? data : (data?.message ?? data?.title ?? res.statusText));
  return data;
}
const api = {
  register: d => req('POST','/auth/register',d),
  login: d => req('POST','/auth/login',d),
  getPosts: p => { const q=p?'?'+new URLSearchParams(Object.fromEntries(Object.entries(p).filter(([,v])=>v))):''; return req('GET','/posts'+q); },
  getPost: id => req('GET',`/posts/${id}`),
  createPost: d => req('POST','/posts',d),
  deletePost: id => req('DELETE',`/posts/${id}`),
  joinPost: id => req('POST',`/posts/${id}/join`),
  approveParticipant: (pid,uid) => req('PUT',`/posts/${pid}/participants/${uid}/approve`),
  rejectParticipant: (pid,uid) => req('PUT',`/posts/${pid}/participants/${uid}/reject`),
  getMessages: id => req('GET',`/posts/${id}/messages`),
  sendMessage: (id,text) => req('POST',`/posts/${id}/messages`,{text}),
  getUser: id => req('GET',`/users/${id}`),
  updateProfile: d => req('PUT','/users/me',d),
  createReview: d => req('POST','/reviews',d),
  getRecommendations: cat => req('GET', '/recommendations' + (cat ? `?category=${cat}` : '')),
  createRecommendation: d => req('POST','/recommendations',d),
  updateRecommendation: (id,d) => req('PUT',`/recommendations/${id}`,d),
  deleteRecommendation: id => req('DELETE',`/recommendations/${id}`),
  uploadImage: async (file) => {
    const token = localStorage.getItem('token');
    const fd = new FormData(); fd.append('image', file);
    const res = await fetch('/upload/image', { method:'POST', headers:{ Authorization:`Bearer ${token}` }, body:fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.title || 'Ошибка загрузки');
    return data.url;
  },
  getGTicketsEvents: () => req('GET', '/gtickets/events'),
  getGTicketsTheater: () => req('GET', '/gtickets/theater'),
  // Friends
  getFriends: () => req('GET', '/friends'),
  getFriendRequests: () => req('GET', '/friends/requests'),
  getFriendStatus: id => req('GET', `/friends/status/${id}`),
  sendFriendRequest: id => req('POST', `/friends/request/${id}`),
  acceptFriend: id => req('PUT', `/friends/${id}/accept`),
  removeFriend: id => req('DELETE', `/friends/${id}`),
  // DM
  getDM: id => req('GET', `/dm/${id}`),
  sendDM: (id, text) => req('POST', `/dm/${id}`, { text }),
  // Avatar
  uploadAvatar: async (file) => {
    const token = localStorage.getItem('token');
    const fd = new FormData(); fd.append('avatar', file);
    const res = await fetch('/upload/avatar', { method:'POST', headers:{ Authorization:`Bearer ${token}` }, body:fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Ошибка загрузки');
    return data.url;
  },
  // Notifications
  getNotifications: () => req('GET', '/notifications'),
  markAllRead: () => req('PUT', '/notifications/read-all'),
  broadcast: msg => req('POST', '/notifications/broadcast', { message: msg }),
  // Friends of any user
  getUserFriends: id => req('GET', `/users/${id}/friends`),
  // Leaderboard
  getLeaderboard: period => req('GET', `/leaderboard?period=${period||'all'}`),
  // Ghost / Attendance
  getGhostStats: id => req('GET', `/users/${id}/ghost`),
  getAttendance: id => req('GET', `/posts/${id}/attendance`),
  submitAttendance: (id, presentUserIds) => req('POST', `/posts/${id}/attendance`, { presentUserIds }),
  // Verification
  getMyVerification: () => req('GET', '/verification/my'),
  submitVerification: async (data) => {
    const token = localStorage.getItem('token');
    const fd = new FormData();
    fd.append('fullName', data.fullName);
    fd.append('passportNumber', data.passportNumber);
    fd.append('birthDate', data.birthDate);
    fd.append('passportPhoto', data.passportPhoto);
    fd.append('selfiePhoto', data.selfiePhoto);
    const res = await fetch('/verification/submit', { method:'POST', headers:{ Authorization:`Bearer ${token}` }, body:fd });
    const json = await res.json();
    if (!res.ok) throw new Error(json.message || 'Ошибка отправки');
    return json;
  },
  getVerificationRequests: () => req('GET', '/verification/requests'),
  approveVerification: id => req('POST', `/verification/${id}/approve`),
  rejectVerification: (id, reason) => req('POST', `/verification/${id}/reject`, { reason }),
};

function fmt(d) { return new Date(d).toLocaleDateString('ru',{day:'numeric',month:'short'}); }
function fmtLong(d) { return new Date(d).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'}); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initials(name) { return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function avatarColor(name) { return T.avatarPalette[(name||'').charCodeAt(0) % T.avatarPalette.length]; }

// Глобальный кеш аватаров — обновляется через SignalR
const _avatarCache = new Map();
let _avatarCacheVersion = 0;
let _avatarCacheListeners = new Set();
function setAvatarCache(userId, url) {
  _avatarCache.set(userId, url);
  _avatarCacheVersion++;
  _avatarCacheListeners.forEach(fn => fn(_avatarCacheVersion));
}
function useAvatarCache() {
  const [v, setV] = React.useState(_avatarCacheVersion);
  React.useEffect(() => {
    _avatarCacheListeners.add(setV);
    return () => _avatarCacheListeners.delete(setV);
  }, []);
  return v;
}

// ── Shared UI ─────────────────────────────────────────────────────────────────
function Av({ name, size=36, url, userId }) {
  useAvatarCache();
  const resolved = (userId && _avatarCache.has(userId)) ? _avatarCache.get(userId) : url;
  if (resolved) return <img src={resolved} alt={name} style={{ width:size, height:size, borderRadius:99, objectFit:'cover', flexShrink:0, border:`2px solid ${T.border}` }} onError={e=>{ e.target.style.display='none'; }}/>;
  return <div style={{ width:size, height:size, borderRadius:99, background:avatarColor(name||''), display:'flex', alignItems:'center', justifyContent:'center', fontSize:size*0.35, fontWeight:800, color:'rgba(0,0,0,0.5)', flexShrink:0 }}>{initials(name)}</div>;
}

function Spinner() {

}

function Btn({ children, onClick, variant='primary', size='md', disabled, full, style={} }) {
  const [pressed, setPressed] = React.useState(false);
  const [ripple, setRipple] = React.useState(null);
  const btnRef = React.useRef(null);
  const base = { display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6, borderRadius:14, fontFamily:"'Plus Jakarta Sans',sans-serif", fontWeight:700, cursor:disabled?'not-allowed':'pointer', border:'none', transition:'transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s, opacity 0.15s', opacity:disabled?0.5:1, position:'relative', overflow:'hidden', transform:pressed?'scale(0.93)':'scale(1)', ...style };
  const sz = size==='sm' ? { padding:'7px 14px', fontSize:13 } : { padding:'12px 22px', fontSize:15 };
  const variants = {
    primary: { background:T.accent, color:'#fff', boxShadow:pressed?`0 1px 4px ${T.accent}44`:`0 4px 16px ${T.accent}55` },
    secondary: { background:T.bgInput, color:T.text, border:`1.5px solid ${T.border}` },
    danger: { background:T.dangerBg, color:T.danger },
    ghost: { background:'transparent', color:T.textSub },
  };
  const handleMouseDown = e => {
    setPressed(true);
    const rect = btnRef.current?.getBoundingClientRect();
    if (rect) { const id = Date.now(); setRipple({ x:e.clientX-rect.left, y:e.clientY-rect.top, id }); setTimeout(()=>setRipple(null), 650); }
  };
  return (
    <button ref={btnRef} onClick={onClick} disabled={disabled}
      onMouseDown={handleMouseDown} onMouseUp={()=>setPressed(false)} onMouseLeave={()=>setPressed(false)}
      style={{ ...base, ...sz, ...variants[variant], ...(full?{width:'100%'}:{}) }}>
      {ripple && <span key={ripple.id} style={{ position:'absolute', left:ripple.x, top:ripple.y, width:8, height:8, borderRadius:99, background:'rgba(255,255,255,0.45)', pointerEvents:'none', animation:'ripple-out 0.6s ease-out forwards' }}/>}
      {children}
    </button>
  );
}

function Input({ value, onChange, placeholder, type='text', error }) {
  const [focused, setFocused] = React.useState(false);
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}

let _toastSet = null;
function ToastContainer() {
  const [toasts, setToasts] = React.useState([]);
  _toastSet = setToasts;
  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:9999, display:'flex', flexDirection:'column', gap:8, pointerEvents:'none' }}>
      {toasts.map(t => (
        <div key={t.id} style={{ padding:'12px 20px', borderRadius:14, background:t.type==='error'?T.dangerBg:T.accentBg, color:t.type==='error'?T.danger:T.accent, border:`1.5px solid ${t.type==='error'?T.danger:T.accent}55`, fontSize:14, fontWeight:600, animation:'toast-in 0.4s cubic-bezier(0.34,1.56,0.64,1)', boxShadow:t.type==='error'?`0 8px 32px ${T.danger}33`:`0 8px 32px ${T.accent}33`, maxWidth:320, backdropFilter:'blur(12px)' }}>
          {t.msg}
        </div>
      ))}
    </div>
  );
}
function toast(msg, type='success') {
  if (!_toastSet) return;
  const id = Date.now();
  _toastSet(p=>[...p,{id,msg,type}]);
  const timeout = msg.length > 60 ? 5000 : type === 'error' ? 4000 : 3000;
  setTimeout(()=>_toastSet(p=>p.filter(t=>t.id!==id)), timeout);
}

function NotificationPanel({ notifications, currentUser, onClose, onMarkAllRead, onNavigatePost }) {
  const [broadcastMsg, setBroadcastMsg] = React.useState('');
  const [sending, setSending] = React.useState(false);

  const typeIcon = t => ({ friend_request:'🤝', friend_accepted:'✅', participant_approved:'🎉', admin_broadcast:'📢' }[t] || '🔔');
  const timeAgo = d => {
    const s = Math.floor((Date.now() - new Date(d)) / 1000);
    if (s < 60) return 'только что';
    if (s < 3600) return `${Math.floor(s/60)} мин. назад`;
    if (s < 86400) return `${Math.floor(s/3600)} ч. назад`;
    return `${Math.floor(s/86400)} дн. назад`;
  };

  const sendBroadcast = async () => {
    if (!broadcastMsg.trim()) return;
    setSending(true);
    try { await api.broadcast(broadcastMsg); setBroadcastMsg(''); toast('Рассылка отправлена!'); }
    catch(e) { toast(e.message,'error'); }

  return (
    <>
      {/* Затемнённый фон */}
      <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:1000 }}/>
      <div style={{ position:'fixed', top:64, left:14, width:340, maxHeight:'70vh', background:T.bgCard, border:`1.5px solid ${T.border}`, borderRadius:18, boxShadow:T.shadow, zIndex:1001, display:'flex', flexDirection:'column', overflow:'hidden', animation:'pop 0.2s ease' }}>

              Прочитать все
            </button>
          )}
        </div>

        {/* Список */}
        <div style={{ flex:1, overflowY:'auto' }}>
          {notifications.length === 0 && (
            <div style={{ textAlign:'center', padding:32, color:T.textMuted, fontSize:14 }}>Уведомлений пока нет</div>
          )}
          {notifications.map(n => (
            <div key={n.id} style={{ display:'flex', gap:12, padding:'12px 16px', borderBottom:`1px solid ${T.border}`, background:n.isRead ? 'transparent' : T.accentBg, transition:'background 0.2s' }}>

            </div>
          ))}

        {/* Форма рассылки — только для admin */}

          <div style={{ padding:'12px 16px', borderTop:`1px solid ${T.border}`, flexShrink:0 }}>
            <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8 }}>Рассылка всем пользователям</div>
            <div style={{ display:'flex', gap:8 }}>

          </div>
        )}
      </div>
    </>
  );
}

// ── FRIENDS MODAL ─────────────────────────────────────────────────────────────
function FriendsModal({ targetUserId, currentUser, onClose, onOpenProfile, onOpenDM }) {
  const [friends, setFriends] = React.useState([]);
  const [requests, setRequests] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [statuses, setStatuses] = React.useState({}); // friendId -> status

  const isOwnProfile = targetUserId === currentUser.id;

  React.useEffect(() => {
    setLoading(true);
    const promises = [api.getUserFriends(targetUserId)];
    if (isOwnProfile) promises.push(api.getFriendRequests());
    Promise.all(promises).then(([fr, reqs]) => {
      setFriends(fr);
      if (reqs) setRequests(reqs);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, [targetUserId]);

  // Загружаем статус дружбы для каждого друга (нужно если смотрим чужой профиль)
  React.useEffect(() => {
    if (isOwnProfile || friends.length === 0) return;
    Promise.all(friends.map(f => api.getFriendStatus(f.id).then(s => [f.id, s]))).then(pairs => {
      setStatuses(Object.fromEntries(pairs));
    }).catch(() => {});
  }, [friends, isOwnProfile]);

  const acceptRequest = async (req) => {
    try {
      await api.acceptFriend(req.id);
      setRequests(r => r.filter(x => x.id !== req.id));
      setFriends(f => [...f, { id: req.from.id, name: req.from.name, username: req.from.username, avatarUrl: req.from.avatarUrl, friendshipId: req.id }]);
      toast(`${req.from.name} теперь твой друг! 🤝`);
    } catch(e) { toast(e.message,'error'); }
  };

  const removeFriend = async (friendshipId, friendName) => {
    try {
      await api.removeFriend(friendshipId);
      setFriends(f => f.filter(x => x.friendshipId !== friendshipId));
      toast(`${friendName} удалён из друзей`);
    } catch(e) { toast(e.message,'error'); }
  };

  const addFriend = async (friendId) => {
    try {

// ── FEED ──────────────────────────────────────────────────────────────────────
function FeedPage({ currentUser, connection, onOpenPost }) {
  const [posts, setPosts] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [filters, setFilters] = React.useState({ activity:'', difficulty:'', status:'active' });
  const [query, setQuery] = React.useState('');

  const load = async () => {
    setLoading(true);
    try { setPosts(await api.getPosts(filters)); } catch {}
    setLoading(false);
  };

  React.useEffect(() => { load(); }, [filters]);

  const filtersRef = React.useRef(filters);
  React.useEffect(() => { filtersRef.current = filters; }, [filters]);

  React.useEffect(() => {
    if (!connection) return;
    const onNew = post => {
      const f = filtersRef.current;
      if (f.activity && post.activity !== f.activity) return;
      if (f.difficulty && post.difficulty !== f.difficulty) return;
      if (f.status && post.status !== f.status) return;
      setPosts(p => [post, ...p]);
    };
    const onDel = id => setPosts(p => p.filter(x => x.id !== id));
    connection.on('NewPost', onNew);
    connection.on('PostDeleted', onDel);
    return () => { connection.off('NewPost', onNew); connection.off('PostDeleted', onDel); };
  }, [connection]);

  const filtered = posts.filter(p => !query || (p.location+p.region+(p.description||'')).toLowerCase().includes(query.toLowerCase()));

  const FilterPill = ({ label, field, value }) => {
    const on = filters[field] === value;
    return <button onClick={()=>setFilters(f=>({...f,[field]:on?'':value}))}
      style={{ padding:'6px 14px', borderRadius:99, border:`1.5px solid ${on?T.accent:T.border}`, background:on?T.accentBg:T.bgInput, color:on?T.accent:T.textSub, fontSize:12, fontWeight:700, cursor:'pointer', transition:'all 0.2s cubic-bezier(0.34,1.56,0.64,1)', fontFamily:"'Plus Jakarta Sans',sans-serif", flexShrink:0, transform:on?'scale(1.05)':'scale(1)' }}>{label}</button>;
  };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
      {/* Topbar */}
      <div style={{ padding:'24px 32px 0', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
          <div style={{ fontSize:26, fontWeight:800, color:T.text, letterSpacing:'-0.02em' }}>Лента событий</div>
          <div className="search-glow" style={{ display:'flex', alignItems:'center', gap:8, background:T.bgInput, border:`1.5px solid ${T.border}`, borderRadius:12, padding:'9px 14px', width:280, transition:'border-color 0.2s, box-shadow 0.2s' }}>
            <div style={{ width:16, height:16, color:T.textMuted, flexShrink:0 }}>{I.search}</div>
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Поиск событий…"
              style={{ flex:1, background:'none', border:'none', outline:'none', fontSize:14, color:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif" }}/>
          </div>
        </div>

        {/* Filters */}
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:24 }}>
          <FilterPill label="Все" field="status" value=""/>
          <FilterPill label="🥾 Поход" field="activity" value="hiking"/>
          <FilterPill label="⛷ Лыжи" field="activity" value="skiing"/>
          <FilterPill label="🏂 Сноуборд" field="activity" value="snowboard"/>
          <FilterPill label="🧗 Трекинг" field="activity" value="trekking"/>
          <div style={{ width:1, background:T.border, margin:'0 4px' }}/>
          <FilterPill label="Новичок" field="difficulty" value="beginner"/>
          <FilterPill label="Средний" field="difficulty" value="medium"/>
          <FilterPill label="Профи" field="difficulty" value="pro"/>
          <div style={{ width:1, background:T.border, margin:'0 4px' }}/>
          <FilterPill label="Открытые" field="status" value="active"/>
          <FilterPill label="Прошедшие" field="status" value="past"/>
        </div>
      </div>

      {/* Grid */}
      <div style={{ flex:1, overflowY:'auto', padding:'0 32px 32px' }}>
        {loading ? (
          <div style={{ display:'flex', justifyContent:'center', paddingTop:80 }}><Spinner/></div>
        ) : filtered.length === 0 ? (
          <div style={{ textAlign:'center', paddingTop:80, color:T.textMuted }}>
            <div style={{ fontSize:40, marginBottom:12 }}>🏔</div>
            <div style={{ fontSize:15, fontWeight:600 }}>Событий не найдено</div>
          </div>
        ) : (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))', gap:16 }}>
            {filtered.map((p,i) => <EventCard key={p.id} post={p} currentUser={currentUser} index={i} onClick={()=>onOpenPost(p.id)}/>)}
          </div>
        )}
      </div>
    </div>
  );
}

// ── EVENT DETAIL ──────────────────────────────────────────────────────────────
function EventDetailPanel({ postId, currentUser, connection, onClose, onNavigateProfile, onGoVerify }) {
  const [post, setPost] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [joining, setJoining] = React.useState(false);
  const [messages, setMessages] = React.useState([]);
  const [msgInput, setMsgInput] = React.useState('');
  const [showAttendance, setShowAttendance] = React.useState(false);
  const [attendanceSubmitted, setAttendanceSubmitted] = React.useState(false);
  const messagesEndRef = React.useRef(null);

  const load = async () => {
    setLoading(true);
    try {
      const p = await api.getPost(postId);
      setPost(p);
      const isAuthor = p.author.id === currentUser.id;
      const isApproved = p.participants.some(pt => pt.userId === currentUser.id && pt.status === 'approved');
      if (isAuthor || isApproved) {
        try { setMessages(await api.getMessages(postId)); } catch {}
        if (p.status === 'past' || p.status === 'closed') {
          try {
            const att = await api.getAttendance(postId);
            setAttendanceSubmitted(att.alreadySubmitted);
          } catch {}
        }
      }
    } catch {}
    setLoading(false);
  };
  React.useEffect(() => { load(); }, [postId]);
  React.useEffect(() => { messagesEndRef.current?.scrollIntoView(); }, [messages]);

  React.useEffect(() => {
    if (!connection) return;
    connection.invoke('JoinPost', postId);
    const onMsg = msg => setMessages(m => [...m, msg]);
    const onParticipant = data => {
      setPost(p => {
        if (!p) return p;
        return {
          ...p,
          filledSpots: data.filledSpots,
          status: data.postStatus,
          participants: p.participants.map(pt =>
            pt.userId === data.userId ? { ...pt, status: data.status } : pt
          )
        };
      });
    };
    const onJoin = data => {
      setPost(p => {
        if (!p) return p;
        const already = p.participants.some(pt => pt.userId === data.userId);
        if (already) return p;
        return { ...p, participants: [...p.participants, data] };
      });
    };
    connection.on('NewMessage', onMsg);
    connection.on('ParticipantUpdated', onParticipant);
    connection.on('ParticipantJoined', onJoin);
    return () => {
      connection.invoke('LeavePost', postId);
      connection.off('NewMessage', onMsg);
      connection.off('ParticipantUpdated', onParticipant);
      connection.off('ParticipantJoined', onJoin);
    };
  }, [connection, postId]);

  const handleJoin = async () => {
    setJoining(true);
    try { await api.joinPost(postId); await load(); toast('Заявка отправлена! Ждите одобрения.'); }
    catch(e) { toast(e.message,'error'); }
    setJoining(false);
  };
  const handleApprove = async (uid, userName) => {
    try {
      const ghost = await api.getGhostStats(uid).catch(() => ({ ghostPercent: 0 }));
      if (ghost.ghostPercent > 0) {
        const ok = confirm(`Вы уверены, что хотите принять ${userName}?\n\n💨 Уровень воздухана: ${ghost.ghostPercent}%\n(не явился на ${ghost.ghostEvents} из ${ghost.totalConfirmedEvents} событий)`);
        if (!ok) return;
      }
      await api.approveParticipant(postId, uid);
      toast('Участник принят ✓');
      load();
    } catch(e) { toast(e.message,'error'); }
  };
  const handleReject = async uid => {
    try { await api.rejectParticipant(postId, uid); toast('Заявка отклонена'); load(); }
    catch(e) { toast(e.message,'error'); }
  };
  const handleDelete = async () => {
    if (!confirm('Удалить событие?')) return;
    try { await api.deletePost(postId); toast('Событие удалено'); onClose(); }
    catch(e) { toast(e.message,'error'); }
  };
  const sendMsg = async () => {
    const text = msgInput.trim(); if (!text) return;
    setMsgInput('');
    try { await api.sendMessage(postId, text); } catch(e) { toast(e.message, 'error'); }
  };

  if (loading) return (
    <div style={{ width:720, borderLeft:`1px solid ${T.border}`, display:'flex', alignItems:'center', justifyContent:'center', background:T.bg }}>
      <Spinner/>
    </div>
  );
  if (!post) return null;

  const isAuthor = post.author.id === currentUser.id;
  const myParticipant = post.participants.find(pt => pt.userId === currentUser.id);
  const isApproved = myParticipant?.status === 'approved';
  const canChat = isAuthor || isApproved;
  const fillPct = Math.round((post.filledSpots / post.totalSpots) * 100);

  return (
    <div style={{ width:720, borderLeft:`1px solid ${T.border}`, display:'flex', flexDirection:'column', background:T.bg, height:'100vh', overflow:'hidden', animation:'panel-in 0.4s cubic-bezier(0.22,1,0.36,1)' }}>
      {/* Header */}
      <div style={{ padding:'20px 24px', borderBottom:`1px solid ${T.border}`, display:'flex', alignItems:'center', gap:14, flexShrink:0 }}>
        <div style={{ width:48, height:48, borderRadius:14, background:T.accentBg, display:'flex', alignItems:'center', justifyContent:'center', color:T.accent, flexShrink:0 }}>
          <div style={{ width:26, height:26 }}>{activityIcons[post.activity]}</div>
        </div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:20, fontWeight:800, color:T.text, letterSpacing:'-0.02em' }}>{post.location}</div>
          <div style={{ fontSize:13, color:T.textMuted }}>{post.region}</div>
        </div>
        <button onClick={onClose} style={{ width:36, height:36, borderRadius:10, border:`1px solid ${T.border}`, background:T.bgInput, color:T.textSub, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <div style={{ width:16, height:16 }}>{I.close}</div>
        </button>
      </div>

      <div style={{ flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', minHeight:0 }}>
        {/* Left — info */}
        <div style={{ overflowY:'auto', padding:'20px 20px' }}>
          {/* Chips */}
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:16 }}>
            <Tag bg={T.bgInput} color={T.textSub}>{activityLabels[post.activity]}</Tag>
            <DiffTag diff={post.difficulty}/>
            <StatusTag status={post.status}/>
            <Tag bg={T.bgInput} color={T.textSub}>{fmt(post.dateFrom)} — {fmt(post.dateTo)}</Tag>
            <Tag bg={T.bgInput} color={T.textSub}>{transportLabels[post.transport]}</Tag>
            {post.budget && <Tag bg={T.goldBg} color={T.gold}>{post.budget}</Tag>}
            {post.requiresSafety && <Tag bg="rgba(91,143,212,0.15)" color="#5B8FD4">🛡️ Только верифицированные</Tag>}
          </div>

          {/* Spots bar */}
          <Card style={{ padding:'14px 16px', marginBottom:16 }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
              <span style={{ fontSize:13, color:T.textSub, fontWeight:600 }}>Участники</span>
              <span style={{ fontSize:13, color:T.text, fontWeight:800 }}>{post.filledSpots} / {post.totalSpots}</span>
            </div>
            <div style={{ height:5, borderRadius:99, background:'rgba(255,255,255,0.06)', overflow:'hidden' }}>
              <div style={{ height:'100%', borderRadius:99, width:`${fillPct}%`, background:T.accent }}/>

          <div style={{ marginBottom:16 }}>
            <SectionLabel>Организатор</SectionLabel>
            <div style={{ display:'flex', alignItems:'center', gap:10, cursor:'pointer' }} onClick={()=>onNavigateProfile(post.author.id)}>
              <Av name={post.author.name} size={38} url={post.author.avatarUrl} userId={post.author.id}/>
              <div>
                <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{post.author.name}</div>
                <div style={{ fontSize:12, color:T.textMuted }}>@{post.author.username}</div>
              </div>

          {/* Participants */}
          {post.participants.length > 0 && (
            <div style={{ marginBottom:16 }}>

              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>

                      <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                        <div style={{ fontSize:13, fontWeight:700, color:T.text, cursor:'pointer' }} onClick={()=>onNavigateProfile(pt.userId)}>{pt.user.name}</div>
                        {pt.user.isVerified && <VerifiedBadge/>}
                      </div>
                      <div style={{ fontSize:11, color:T.textMuted }}>@{pt.user.username}</div>
                    </div>
                    <Tag color={pt.status==='approved'?T.success:pt.status==='rejected'?T.danger:T.textSub} bg={pt.status==='approved'?T.successBg:pt.status==='rejected'?T.dangerBg:T.bgInput}>
                      {pt.status==='approved'?'Принят':pt.status==='rejected'?'Отклонён':'Ожидает'}
                    </Tag>
                    {isAuthor && pt.status==='pending' && (
                      <div style={{ display:'flex', gap:6 }}>
                        <Btn size="sm" onClick={()=>handleApprove(pt.userId, pt.user.name)}>✓</Btn>
                        <Btn size="sm" variant="danger" onClick={()=>handleReject(pt.userId)}>✕</Btn>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Actions */}
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            {!isAuthor && post.status==='active' && !myParticipant && (
              post.requiresSafety && !currentUser.isVerified
                ? <button onClick={onGoVerify} style={{ padding:'10px 16px', borderRadius:12, background:'rgba(91,143,212,0.12)', border:'1px solid rgba(91,143,212,0.3)', fontSize:13, color:'#5B8FD4', fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:8, fontFamily:"'Plus Jakarta Sans',sans-serif", transition:'all 0.15s' }}
                    onMouseEnter={e=>e.currentTarget.style.background='rgba(91,143,212,0.22)'}
                    onMouseLeave={e=>e.currentTarget.style.background='rgba(91,143,212,0.12)'}>
                    🛡️ Подтвердите личность для участия →
                  </button>
                : <Btn onClick={handleJoin} disabled={joining}>{joining?<Spinner/>:'Подать заявку'}</Btn>
            )}
            {myParticipant && (
              <Tag color={myParticipant.status==='approved'?T.success:T.textSub} bg={myParticipant.status==='approved'?T.successBg:T.bgInput}>
                Заявка: {myParticipant.status==='approved'?'Принята':myParticipant.status==='rejected'?'Отклонена':'На рассмотрении'}
              </Tag>
            )}
            {isAuthor && <Btn variant="danger" size="sm" onClick={handleDelete}>Удалить</Btn>}
            {canChat && (post.status==='past'||post.status==='closed') && (
              attendanceSubmitted
                ? <Tag bg={T.successBg} color={T.success}>✓ Посещаемость отмечена</Tag>
                : <Btn size="sm" onClick={()=>setShowAttendance(true)}>✅ Отметить участников</Btn>
            )}
          </div>
        </div>

        {showAttendance && (
          <AttendanceModal
            post={post}
            currentUser={currentUser}
            onClose={()=>setShowAttendance(false)}
            onDone={()=>{ setShowAttendance(false); setAttendanceSubmitted(true); }}
          />
        )}

        {/* Right — chat */}
        <div style={{ borderLeft:`1px solid ${T.border}`, display:'flex', flexDirection:'column', minHeight:0 }}>
          <div style={{ padding:'14px 16px', borderBottom:`1px solid ${T.border}`, flexShrink:0 }}>
            <div style={{ fontSize:14, fontWeight:700, color:T.text }}>💬 Чат группы</div>
            {!canChat && <div style={{ fontSize:12, color:T.textMuted, marginTop:2 }}>Только для участников</div>}
          </div>

          {canChat ? <>
            <div style={{ flex:1, overflowY:'auto', padding:'14px 16px', display:'flex', flexDirection:'column', gap:8, background:'rgba(0,0,0,0.15)' }}>
              {messages.length === 0 && (
                <div style={{ textAlign:'center', color:T.textMuted, fontSize:13, marginTop:40 }}>Сообщений пока нет</div>
              )}
              {messages.map((m, i) => {
                const mine = m.author.id === currentUser.id;
                const prev = messages[i-1];
                const showName = !mine && (!prev || prev.author.id !== m.author.id);
                return (
                  <div key={m.id} style={{ display:'flex', flexDirection:mine?'row-reverse':'row', alignItems:'flex-end', gap:6, animation:mine?'msg-in-right 0.25s ease both':'msg-in-left 0.25s ease both' }}>
                    {!mine && <Av name={m.author.name} size={26} url={m.author.avatarUrl} userId={m.author.id}/>}
                    <div style={{ maxWidth:'75%', display:'flex', flexDirection:'column', alignItems:mine?'flex-end':'flex-start', gap:2 }}>
                      {showName && <span style={{ fontSize:11, color:T.textMuted, fontWeight:600, marginLeft:4, display:'flex', alignItems:'center', gap:4 }}>{m.author.name}{m.author.isVerified && <VerifiedBadge/>}</span>}
                      <div style={{ background:mine?T.bubbleMe:T.bubbleOther, color:mine?'#fff':T.text, borderRadius:mine?'16px 16px 5px 16px':'16px 16px 16px 5px', padding:'10px 14px', fontSize:13, lineHeight:1.55, boxShadow:mine?`0 4px 16px ${T.accent}33`:'0 2px 8px rgba(0,0,0,0.15)' }}>
                        {m.text}
                      </div>
                      <span style={{ fontSize:10, color:T.textMuted, padding:'0 4px' }}>{new Date(m.createdAt).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</span>
                    </div>
                  </div>
                );
              })}
              <div ref={messagesEndRef}/>
            </div>
            <div style={{ padding:'10px 12px', borderTop:`1px solid ${T.border}`, display:'flex', gap:8, flexShrink:0 }}>
              <input value={msgInput} onChange={e=>setMsgInput(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }}
                placeholder="Сообщение…"
                style={{ flex:1, background:T.bgInput, border:`1.5px solid ${T.border}`, borderRadius:10, padding:'9px 12px', fontSize:13, fontFamily:"'Plus Jakarta Sans',sans-serif", color:T.text, outline:'none' }}/>
              <button onClick={sendMsg}
                style={{ width:36, height:36, borderRadius:10, border:'none', background:msgInput.trim()?T.accent:T.bgInput, color:msgInput.trim()?'#fff':T.textMuted, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s' }}>
                <div style={{ width:16, height:16 }}>{I.send}</div>
              </button>
            </div>
          </> : (
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', flex:1, color:T.textMuted, fontSize:14, flexDirection:'column', gap:8 }}>
              <div style={{ fontSize:28 }}>🔒</div>
              <div>Вступи в поездку, чтобы написать</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── CREATE ────────────────────────────────────────────────────────────────────
function CreatePage({ onDone }) {
  const [step, setStep] = React.useState(0);
  const [form, setForm] = React.useState({ activity:'', location:'', region:'', dateFrom:'', dateTo:'', difficulty:'medium', spots:4, transport:'has-seats', budget:'', description:'', requiresSafety:false });
  const [errors, setErrors] = React.useState({});
  const [loading, setLoading] = React.useState(false);
  const set = k => v => { setForm(f=>({...f,[k]:v})); setErrors(e=>({...e,[k]:false})); };

  const validate = () => {
    const e = {};
    if (step===0) { if(!form.activity)e.activity=true; if(!form.location)e.location=true; }
    if (step===1) { if(!form.dateFrom)e.dateFrom=true; if(!form.dateTo)e.dateTo=true; }
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const next = () => { if (validate()) setStep(s=>s+1); };
  const submit = async () => {
    if (!validate()) return;
    setLoading(true);
    try {
      const res = await api.createPost({ ...form, totalSpots: form.spots, dateFrom: new Date(form.dateFrom).toISOString(), dateTo: new Date(form.dateTo).toISOString(), budget: form.budget||null, description: form.description||null, requiresSafety: form.requiresSafety });
      onDone(res.id);
    } catch(e) { toast(e.message, 'error'); }
    setLoading(false);
  };

  const activities = [
    { id:'hiking', label:'🥾 Поход', icon:I.hiking },
    { id:'skiing', label:'⛷ Лыжи', icon:I.skiing },
    { id:'snowboard', label:'🏂 Сноуборд', icon:I.snowboard },
    { id:'trekking', label:'🧗 Трекинг', icon:I.trekking },
  ];

  const StepDot = ({ i }) => <div style={{ width:i<step?8:i===step?24:8, height:8, borderRadius:99, background:i<=step?T.accent:'rgba(255,255,255,0.1)', transition:'all 0.3s' }}/>;

  return (
    <div style={{ flex:1, overflowY:'auto', padding:40, display:'flex', justifyContent:'center' }}>
      <div style={{ width:'100%', maxWidth:600 }}>
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:28 }}>
          {[0,1,2].map(i=><StepDot key={i} i={i}/>)}
          <span style={{ fontSize:13, color:T.textMuted, fontWeight:600, marginLeft:8 }}>Шаг {step+1} из 3</span>
        </div>

        {step===0 && (
          <div style={{ animation:'page-enter 0.4s cubic-bezier(0.22,1,0.36,1) both' }}>
            <div style={{ fontSize:26, fontWeight:800, color:T.text, marginBottom:6 }}>Куда едем?</div>
            <div style={{ fontSize:15, color:T.textMuted, marginBottom:28 }}>Выбери активность и место</div>

            <div style={{ marginBottom:24 }}>
              <SectionLabel>Тип активности {errors.activity&&<span style={{color:T.danger}}> — обязательно</span>}</SectionLabel>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:10 }}>
                {activities.map(a => {
                  const on = form.activity===a.id;
                  return <button key={a.id} onClick={()=>set('activity')(a.id)}
                    style={{ padding:'16px 8px', borderRadius:14, border:`2px solid ${on?T.accent:errors.activity?T.danger:T.border}`, background:on?T.accentBg:T.bgInput, cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:8, fontFamily:"'Plus Jakarta Sans',sans-serif", transition:'all 0.15s' }}>
                    <div style={{ width:28, height:28, color:on?T.accent:T.textSub }}>{a.icon}</div>
                    <span style={{ fontSize:12, fontWeight:700, color:on?T.accent:T.textSub }}>{a.label}</span>
                  </button>;
                })}
              </div>
            </div>

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:24 }}>
              <div>
                <SectionLabel>Локация {errors.location&&<span style={{color:T.danger}}> — обязательно</span>}</SectionLabel>
                <Input value={form.location} onChange={set('location')} placeholder="Эльбрус, Алматы…" error={errors.location}/>
              </div>
              <div>
                <SectionLabel>Регион / маршрут</SectionLabel>
                <Input value={form.region} onChange={set('region')} placeholder="Кабардино-Балкария"/>
              </div>
            </div>

            <Btn onClick={next} full>Дальше →</Btn>
          </div>
        )}

        {step===1 && (
          <div style={{ animation:'page-enter 0.4s cubic-bezier(0.22,1,0.36,1) both' }}>
            <div style={{ fontSize:26, fontWeight:800, color:T.text, marginBottom:6 }}>Когда и кто?</div>
            <div style={{ fontSize:15, color:T.textMuted, marginBottom:28 }}>Даты, уровень и транспорт</div>

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:20 }}>
              <div>
                <SectionLabel>Дата начала</SectionLabel>
                <input type="date" value={form.dateFrom} onChange={e=>set('dateFrom')(e.target.value)}
                  style={{ background:T.bgInput, border:`1.5px solid ${errors.dateFrom?T.danger:T.border}`, borderRadius:12, padding:'11px 14px', fontSize:14, color:T.text, width:'100%', outline:'none', fontFamily:"'Plus Jakarta Sans',sans-serif", colorScheme:'dark' }}/>
              </div>
              <div>
                <SectionLabel>Дата конца</SectionLabel>
                <input type="date" value={form.dateTo} onChange={e=>set('dateTo')(e.target.value)}
                  style={{ background:T.bgInput, border:`1.5px solid ${errors.dateTo?T.danger:T.border}`, borderRadius:12, padding:'11px 14px', fontSize:14, color:T.text, width:'100%', outline:'none', fontFamily:"'Plus Jakarta Sans',sans-serif", colorScheme:'dark' }}/>
              </div>
            </div>

            <div style={{ marginBottom:20 }}>
              <SectionLabel>Сложность</SectionLabel>
              <div style={{ display:'flex', gap:8 }}>
                {['beginner','medium','pro'].map(d => {
                  const on = form.difficulty===d;
                  return <button key={d} onClick={()=>set('difficulty')(d)}
                    style={{ flex:1, padding:'11px', borderRadius:12, border:`1.5px solid ${on?T.accent:T.border}`, background:on?T.accentBg:T.bgInput, color:on?T.accent:T.textSub, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:13, fontWeight:700, cursor:'pointer', transition:'all 0.15s' }}>
                    {diffLabels[d]}
                  </button>;
                })}
              </div>
            </div>

            <div style={{ marginBottom:20 }}>
              <SectionLabel>Всего мест</SectionLabel>
              <div style={{ display:'flex', alignItems:'center', gap:16 }}>
                <button onClick={()=>set('spots')(Math.max(2,form.spots-1))} style={{ width:36,height:36,borderRadius:99,border:`1.5px solid ${T.border}`,background:T.bgInput,color:T.text,fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center' }}>−</button>
                <span style={{ fontSize:22, fontWeight:800, color:T.text, minWidth:30, textAlign:'center' }}>{form.spots}</span>
                <button onClick={()=>set('spots')(Math.min(20,form.spots+1))} style={{ width:36,height:36,borderRadius:99,border:`1.5px solid ${T.border}`,background:T.bgInput,color:T.text,fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center' }}>+</button>
              </div>
            </div>

            <div style={{ marginBottom:24 }}>
              <SectionLabel>Транспорт</SectionLabel>
              {[['has-seats','🚗 Есть места в машине'],['need-ride','🚕 Ищу машину'],['public','🚌 Автобус / поезд']].map(([id,label]) => {
                const on = form.transport===id;
                return <button key={id} onClick={()=>set('transport')(id)}
                  style={{ display:'flex', alignItems:'center', gap:12, width:'100%', padding:'13px 16px', borderRadius:12, border:`1.5px solid ${on?T.accent:T.border}`, background:on?T.accentBg:T.bgInput, color:on?T.accent:T.text, fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:13, fontWeight:600, cursor:'pointer', marginBottom:8, transition:'all 0.15s' }}>
                  {on && <div style={{ width:18,height:18,color:T.accent }}>{I.check}</div>}

              })}

            <div style={{ marginBottom:24 }}>
              <SectionLabel>Безопасность</SectionLabel>
              <button onClick={()=>set('requiresSafety')(!form.requiresSafety)}
                style={{ display:'flex', alignItems:'center', gap:14, width:'100%', padding:'14px 16px', borderRadius:12, border:`1.5px solid ${form.requiresSafety?T.accent:T.border}`, background:form.requiresSafety?T.accentBg:T.bgInput, cursor:'pointer', textAlign:'left', fontFamily:"'Plus Jakarta Sans',sans-serif", transition:'all 0.2s' }}>
                <div style={{ width:22, height:22, borderRadius:6, border:`2px solid ${form.requiresSafety?T.accent:T.textMuted}`, background:form.requiresSafety?T.accent:'transparent', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'all 0.15s' }}>
                  {form.requiresSafety && <div style={{ width:12, height:12, color:'#fff' }}>{I.check}</div>}
                </div>
                <div>
                  <div style={{ fontSize:13, fontWeight:700, color:form.requiresSafety?T.accent:T.text }}>🛡️ Только верифицированные участники</div>
                  <div style={{ fontSize:12, color:T.textMuted, marginTop:2 }}>Заявку смогут подать только пользователи, подтвердившие личность</div>
                </div>
              </button>
            </div>

            <div style={{ display:'flex', gap:10 }}>
              <Btn variant="secondary" onClick={()=>setStep(0)}>← Назад</Btn>
              <Btn onClick={next} full>Дальше →</Btn>
            </div>
          </div>
        )}

        {step===2 && (
          <div style={{ animation:'page-enter 0.4s cubic-bezier(0.22,1,0.36,1) both' }}>
            <div style={{ fontSize:26, fontWeight:800, color:T.text, marginBottom:6 }}>Детали</div>
            <div style={{ fontSize:15, color:T.textMuted, marginBottom:28 }}>Бюджет и описание — необязательно</div>

            <div style={{ marginBottom:20 }}>
              <SectionLabel>Бюджет</SectionLabel>
              <Input value={form.budget} onChange={set('budget')} placeholder="~15 000 ₽ на человека"/>
            </div>

            <div style={{ marginBottom:24 }}>
              <SectionLabel>Описание</SectionLabel>
              <Textarea value={form.description} onChange={set('description')} placeholder="Расскажи о маршруте, планах, снаряжении…" rows={5}/>
            </div>

            {/* Preview */}
            {form.location && (
              <Card style={{ padding:16, marginBottom:20, borderColor:T.accent }}>
                <div style={{ fontSize:11, color:T.textMuted, fontWeight:700, letterSpacing:'0.07em', textTransform:'uppercase', marginBottom:10 }}>Предпросмотр</div>
                <div style={{ display:'flex', gap:12, alignItems:'center' }}>
                  <div style={{ width:40,height:40,borderRadius:12,background:T.accentBg,display:'flex',alignItems:'center',justifyContent:'center',color:T.accent }}>
                    <div style={{ width:22,height:22 }}>{activityIcons[form.activity]||I.mountain}</div>

                  <div>
                    <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{form.location}</div>
                    <div style={{ fontSize:12, color:T.textMuted }}>{form.dateFrom?fmt(form.dateFrom):''} — {form.dateTo?fmt(form.dateTo):''} · {form.spots} мест</div>

                  <DiffTag diff={form.difficulty}/>
                </div>
              </Card>
            )}

            <div style={{ display:'flex', gap:10 }}>
              <Btn variant="secondary" onClick={()=>setStep(1)}>← Назад</Btn>
              <Btn onClick={submit} disabled={loading} full>{loading?<Spinner/>:'Опубликовать событие'}</Btn>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── DM (личные чаты) ──────────────────────────────────────────────────────────
function DMPage({ currentUser, connection, initialFriend, onNavigateProfile, onFriendOpen }) {
  const [friends, setFriends] = React.useState([]);
  const [requests, setRequests] = React.useState([]);
  const [openFriend, setOpenFriend] = React.useState(initialFriend || null);
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState('');
  const [loadingMsg, setLoadingMsg] = React.useState(false);
  const endRef = React.useRef(null);
  const openFriendRef = React.useRef(null);

  React.useEffect(() => {
    api.getFriends().then(setFriends).catch(()=>{});
    api.getFriendRequests().then(setRequests).catch(()=>{});
  }, []);

  React.useEffect(() => {
    if (initialFriend) openChat(initialFriend);
  }, [initialFriend?.id]);

  const openChat = async (friend) => {
    if (connection && openFriendRef.current)
      connection.invoke('LeaveDM', currentUser.id, openFriendRef.current.id);
    setOpenFriend(friend);
    openFriendRef.current = friend;
    setLoadingMsg(true);
    onFriendOpen && onFriendOpen(friend.id);
    try { setMessages(await api.getDM(friend.id)); } catch(e) { toast(e.message,'error'); }
    setLoadingMsg(false);
    if (connection) connection.invoke('JoinDM', currentUser.id, friend.id);
  };

  React.useEffect(() => { endRef.current?.scrollIntoView(); }, [messages]);

  React.useEffect(() => {
    if (!connection) return;
    const onDM = msg => { if (openFriendRef.current) setMessages(m => [...m, msg]); };
    connection.on('NewDM', onDM);
    return () => connection.off('NewDM', onDM);
  }, [connection]);

  const send = async () => {
    const text = input.trim(); if (!text || !openFriend) return;
    setInput('');
    try { await api.sendDM(openFriend.id, text); } catch(e) { toast(e.message,'error'); }
  };

  const acceptRequest = async (req) => {
    await api.acceptFriend(req.id);
    setRequests(r => r.filter(x => x.id !== req.id));
    setFriends(f => [...f, { id: req.from.id, name: req.from.name, username: req.from.username, avatarUrl: req.from.avatarUrl }]);
    toast(`${req.from.name} теперь твой друг! 🤝`);
  };

  return (
    <div style={{ flex:1, display:'flex', minHeight:0 }}>
      {/* Левая панель */}
      <div style={{ width:300, borderRight:`1px solid ${T.border}`, display:'flex', flexDirection:'column', flexShrink:0 }}>
        <div style={{ padding:'20px 20px 12px', flexShrink:0 }}>
          <div style={{ fontSize:20, fontWeight:800, color:T.text }}>Друзья</div>
        </div>

        {/* Входящие запросы */}
        {requests.length > 0 && (
          <div style={{ padding:'0 12px 8px' }}>
            <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8, padding:'0 4px' }}>
              Запросы в друзья ({requests.length})
            </div>
            {requests.map(req => (
              <div key={req.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:12, background:T.accentBg, marginBottom:6, border:`1px solid ${T.accent}33` }}>
                <Av name={req.from.name} size={36} url={req.from.avatarUrl} userId={req.from.id}/>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:T.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{req.from.name}</div>
                  <div style={{ fontSize:11, color:T.textMuted }}>@{req.from.username}</div>
                </div>
                <button onClick={()=>acceptRequest(req)}
                  style={{ padding:'5px 10px', borderRadius:8, border:'none', background:T.accent, color:'#fff', fontSize:12, fontWeight:700, cursor:'pointer' }}>
                  ✓
                </button>
              </div>
            ))}
          </div>
        )}

        {/* Список друзей */}
        <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:'uppercase', letterSpacing:'0.07em', padding:'4px 16px 8px' }}>
          {friends.length > 0 ? `Друзья (${friends.length})` : ''}
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:'0 12px 16px', display:'flex', flexDirection:'column', gap:4 }}>
          {friends.length === 0 && requests.length === 0 && (
            <div style={{ textAlign:'center', paddingTop:40, color:T.textMuted, fontSize:14 }}>
              Пока нет друзей.<br/>Зайди в профиль и добавь!
            </div>
          )}
          {friends.map(f => (
            <button key={f.id} onClick={()=>openChat(f)}
              style={{ textAlign:'left', padding:'10px 12px', borderRadius:12, border:`1.5px solid ${openFriend?.id===f.id?T.accent:T.border}`, background:openFriend?.id===f.id?T.accentBg:T.bgCard, cursor:'pointer', fontFamily:"'Plus Jakarta Sans',sans-serif", transition:'all 0.15s' }}>

function ChatsPage({ currentUser, connection, onNavigateProfile }) {
  const [posts, setPosts] = React.useState([]);
  const [openPost, setOpenPost] = React.useState(null);
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState('');
  const [loadingMsg, setLoadingMsg] = React.useState(false);
  const endRef = React.useRef(null);
  const openPostRef = React.useRef(null);

  React.useEffect(() => {
    // Load all posts and check which ones the user can chat in
    api.getPosts({status:''}).then(async all => {
      const chatPosts = [];
      for (const p of all) {
        if (p.author.id === currentUser.id) { chatPosts.push(p); continue; }
        // Check full post to see if user is approved participant
        try {
          const full = await api.getPost(p.id);
          const me = full.participants.find(pt => pt.userId === currentUser.id);
          if (me?.status === 'approved') chatPosts.push(p);
        } catch {}
      }
      setPosts(chatPosts);
    }).catch(()=>{});
  }, []);

  const openChat = async (post) => {
    if (connection && openPostRef.current) connection.invoke('LeavePost', openPostRef.current.id);
    setOpenPost(post);
    openPostRef.current = post;
    setLoadingMsg(true);
    try { setMessages(await api.getMessages(post.id)); } catch(e) { toast(e.message,'error'); }
    setLoadingMsg(false);
    if (connection) connection.invoke('JoinPost', post.id);
  };

  React.useEffect(() => { endRef.current?.scrollIntoView(); }, [messages]);

  React.useEffect(() => {
    if (!connection) return;
    const onMsg = msg => {
      if (openPostRef.current) setMessages(m => [...m, msg]);
    };
    connection.on('NewMessage', onMsg);
    return () => connection.off('NewMessage', onMsg);
  }, [connection]);

  const send = async () => {
    const text = input.trim(); if (!text||!openPost) return;
    setInput('');
    try { await api.sendMessage(openPost.id, text); }
    catch(e) { toast(e.message,'error'); }
  };

  return (
    <div style={{ flex:1, display:'flex', minHeight:0 }}>
      {/* List */}
      <div style={{ width:300, borderRight:`1px solid ${T.border}`, display:'flex', flexDirection:'column', flexShrink:0 }}>
        <div style={{ padding:'24px 20px 16px', flexShrink:0 }}>
          <div style={{ fontSize:22, fontWeight:800, color:T.text }}>Чаты</div>
          <div style={{ fontSize:13, color:T.textMuted, marginTop:4 }}>Группы событий, в которых ты участвуешь</div>
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:'0 12px 16px', display:'flex', flexDirection:'column', gap:4 }}>
          {posts.length===0 && <div style={{ textAlign:'center', paddingTop:40, color:T.textMuted, fontSize:14 }}>Нет активных чатов</div>}
          {posts.map(p => (
            <button key={p.id} onClick={()=>openChat(p)}
              style={{ textAlign:'left', padding:'12px 14px', borderRadius:14, border:`1.5px solid ${openPost?.id===p.id?T.accent:T.border}`, background:openPost?.id===p.id?T.accentBg:T.bgCard, cursor:'pointer', fontFamily:"'Plus Jakarta Sans',sans-serif", transition:'all 0.15s' }}>
              <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                <div style={{ width:40,height:40,borderRadius:12,background:T.accentBg,display:'flex',alignItems:'center',justifyContent:'center',color:T.accent,flexShrink:0 }}>
                  <div style={{ width:22,height:22 }}>{activityIcons[p.activity]}</div>

                <div style={{ flex:1, minWidth:0 }}>

                </div>

            </button>

        </div>
      </div>

      {/* Chat area */}
      {openPost ? (
        <div style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
          <div style={{ padding:'16px 24px', borderBottom:`1px solid ${T.border}`, display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>

            {messages.length===0 && <div style={{ textAlign:'center', color:T.textMuted, fontSize:14, marginTop:40 }}>Напишите первое сообщение!</div>}
            {messages.map((m,i) => {

function ActivityChart({ data }) {
  if (!data || data.length === 0) return null;
  const max = Math.max(...data.map(d => d.trips), 1);
  const months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  return (
    <div style={{ display:'flex', alignItems:'flex-end', gap:6, height:80, padding:'0 4px' }}>
      {data.map((d, i) => {
        const pct = d.trips / max;
        const monthIdx = parseInt(d.month.split('-')[1]) - 1;
        return (
          <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
            <div style={{ width:'100%', borderRadius:4, background: d.trips > 0 ? T.accent : T.border, height: Math.max(pct * 60, d.trips > 0 ? 6 : 2), transition:'height 0.4s ease' }}/>
            <div style={{ fontSize:9, color:T.textMuted, fontWeight:600 }}>{months[monthIdx]}</div>
          </div>
        );
      })}
    </div>
  );
}

function RatingBar({ star, count, max }) {
  const pct = max > 0 ? (count / max) * 100 : 0;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
      <div style={{ fontSize:11, color:T.textMuted, width:16, textAlign:'right', fontWeight:600 }}>{star}</div>
      <div style={{ flex:1, height:6, borderRadius:4, background:T.border, overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', borderRadius:4, background:T.gold, transition:'width 0.4s ease' }}/>
      </div>
      <div style={{ fontSize:11, color:T.textMuted, width:18, fontWeight:600 }}>{count}</div>
    </div>
  );
}

function ProfilePage({ userId, currentUser, onOpenDM, onNavigateProfile, autoOpenVerify, onVerifyOpened, onUserUpdate }) {
  const [user, setUser] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [showReviewForm, setShowReviewForm] = React.useState(false);
  const [reviewForm, setReviewForm] = React.useState({ rating:5, text:'' });
  const [editing, setEditing] = React.useState(false);
  const [editForm, setEditForm] = React.useState({ name:'', location:'', bio:'' });
  const [saving, setSaving] = React.useState(false);
  const [avatarUploading, setAvatarUploading] = React.useState(false);
  const [friendStatus, setFriendStatus] = React.useState(null);
  const [friendLoading, setFriendLoading] = React.useState(false);
  const [showFriendsModal, setShowFriendsModal] = React.useState(false);
  const [verifStatus, setVerifStatus] = React.useState(null);
  const [showVerifForm, setShowVerifForm] = React.useState(false);
  const [verifForm, setVerifForm] = React.useState({ fullName:'', passportNumber:'', birthDate:'' });
  const [verifFiles, setVerifFiles] = React.useState({ passportPhoto:null, selfiePhoto:null });
  const [verifLoading, setVerifLoading] = React.useState(false);
  const [rejectReason, setRejectReason] = React.useState('');

  React.useEffect(() => {
    setLoading(true);
    api.getUser(userId).then(u=>{ setUser(u); setLoading(false); }).catch(()=>setLoading(false));
  }, [userId]);

  React.useEffect(() => {
    if (userId !== currentUser.id) {
      api.getFriendStatus(userId).then(s => setFriendStatus(s)).catch(()=>{});
    } else {
      api.getMyVerification().then(v => setVerifStatus(v)).catch(()=>{});
    }
  }, [userId]);

  React.useEffect(() => {
    if (autoOpenVerify && userId === currentUser.id) {
      setShowVerifForm(true);
      onVerifyOpened && onVerifyOpened();
      setTimeout(() => {
        document.getElementById('verif-section')?.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 150);
    }
  }, [autoOpenVerify]);

  const openEdit = () => {
    setEditForm({ name: user.name, location: user.location || '', bio: user.bio || '' });
    setEditing(true);
  };

  const handleAvatarUpload = async (file) => {
    if (!file) return;
    setAvatarUploading(true);
    try {
      const url = await api.uploadAvatar(file);
      setUser(u => ({ ...u, avatarUrl: url }));
      // обновляем user в localStorage
      const stored = JSON.parse(localStorage.getItem('user') || '{}');
      localStorage.setItem('user', JSON.stringify({ ...stored, avatarUrl: url }));
      toast('Аватар обновлён ✓');
    } catch(e) { toast(e.message, 'error'); }
    finally { setAvatarUploading(false); }
  };

  const handleFriendAction = async () => {
    setFriendLoading(true);
    try {
      if (!friendStatus || friendStatus.status === 'none') {
        await api.sendFriendRequest(userId);
        setFriendStatus({ status:'pending', isSender:true });
        toast('Запрос отправлен!');
      } else if (friendStatus.status === 'pending' && !friendStatus.isSender) {
        await api.acceptFriend(friendStatus.friendshipId);
        setFriendStatus({ ...friendStatus, status:'accepted' });
        toast('Дружба принята! 🤝');
      } else if (friendStatus.status === 'accepted') {
        await api.removeFriend(friendStatus.friendshipId);
        setFriendStatus({ status:'none' });
        toast('Удалён из друзей');
      }
    } catch(e) { toast(e.message,'error'); }
    finally { setFriendLoading(false); }
  };

  const submitVerification = async () => {
    if (!verifForm.fullName.trim() || !verifForm.passportNumber.trim() || !verifForm.birthDate)
      return toast('Заполните все поля', 'error');
    if (!verifFiles.passportPhoto || !verifFiles.selfiePhoto)
      return toast('Загрузите оба фото', 'error');
    setVerifLoading(true);
    try {
      await api.submitVerification({ ...verifForm, ...verifFiles });
      const v = await api.getMyVerification();
      setVerifStatus(v);
      setShowVerifForm(false);
      toast('Заявка отправлена на проверку!');
    } catch(e) { toast(e.message, 'error'); }
    finally { setVerifLoading(false); }
  };

  // Обновляем isVerified в localStorage когда верификация одобрена
  React.useEffect(() => {
    if (verifStatus?.status === 'approved' && isMe && !currentUser.isVerified) {
      const fresh = { ...currentUser, isVerified: true };
      localStorage.setItem('user', JSON.stringify(fresh));
      onUserUpdate && onUserUpdate(fresh);
    }
  }, [verifStatus?.status]);

  const saveProfile = async () => {
    setSaving(true);
    try {
      await api.updateProfile(editForm);
      const u = await api.getUser(userId);
      setUser(u);
      setEditing(false);
    } catch(e) { toast(e.message, 'error'); }
    finally { setSaving(false); }
  };

    try {
      await api.createReview({ toUserId: parseInt(userId), postId: 0, rating: reviewForm.rating, text: reviewForm.text });
